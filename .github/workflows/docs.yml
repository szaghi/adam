name: Docs
# After a CI run on the default branch: the VitePress site built in the toolchain image, with the coverage badge from
# CI's coverage-docs artifact, deployed to GitHub Pages, by the reusable workflow of fortran-toolchains
# (https://github.com/szaghi/fortran-toolchains). A manual dispatch runs the coverage itself.
# Project-owned (fobos [scaffold] skip), not the scaffold's docs.yml, for ADAM's build command:
# - docs/reference/build-modes.md regenerated from `fobis build --lmodes`, so the published list cannot drift from the
#   fobos files (issue #60, P3);
# - formal run here (ADAM's docs/package.json has no predocs:build hook);
# - Node's heap raised: the site (API reference + MathJax pages) peaks at about 4.3 GB, past Node's default (~4 GB).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
# all four, even when nothing deploys: GitHub checks what the called workflow's jobs request at startup
permissions:
  contents: read
  actions: read     # the coverage-docs artifact of the CI run
  pages: write
  id-token: write
# one docs run at a time, none cancelled half-way
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  docs:
    uses: szaghi/fortran-toolchains/.github/workflows/docs.yml@v1
    with:
      toolchain: 'linux-gnu'
      build-command: >-
        python3 scripts/make_build_modes_page.py &&
        formal generate --mirror-sources --diagrams --project docs/ford.md --output docs/api &&
        cd docs && npm ci --no-audit --no-fund &&
        NODE_OPTIONS=--max-old-space-size=8192 npm run docs:build

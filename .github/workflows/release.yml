name: Release ADAM
# A pushed vX.Y.Z tag: the GitHub release (the source tarball with the fobos dependencies bundled, the tag's
# CHANGELOG.md section as the notes, scripts/install.sh), by the reusable workflow of fortran-toolchains
# (https://github.com/szaghi/fortran-toolchains). Project-owned (fobos [scaffold] skip): the scaffold's release.yml
# also installs the release on a fresh runner (install.yml), which cannot build ADAM (no MPI, no HDF5 there).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:   # from a tag; from a branch the release job does nothing

permissions:
  contents: write

jobs:
  release:
    uses: szaghi/fortran-toolchains/.github/workflows/release.yml@v1

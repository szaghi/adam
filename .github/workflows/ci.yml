name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: fobis fetch

    - name: Run tests with coverage
      id: cov
      uses: ./.github/actions/run-coverage-analysis

  regression-prism-cpu:
    # PRISM CPU regression suite. Reference baseline for the
    # forest-of-trees migration (issue #10): every structural change
    # must leave this suite green.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: fobis fetch

    - name: Install FFTW
      # Every PRISM mode links -lfftw3: FLAIL's t0 elliptic solves (issue #84, E3b).
      run: sudo apt install -y libfftw3-dev

    - name: Run PRISM CPU regression
      # The ci_gnu varset (fobos) points HDF5 at lib/hdf5/develop/gnu/14.2.0:
      # the runner's apt gfortran-14 cannot read the default local_gnu HDF5,
      # built by gfortran 16.2.
      run: ./src/tests/prism/regression/run.sh cpu --varset ci_gnu

    - name: Upload regression work outputs
      # Runs even when the regression step fails — the produced digest and
      # residuals are how a golden is (re)captured from a known-good CI run,
      # and how a failing run is diagnosed. work-*/ is gitignored scratch on
      # the runner, so without this upload the outputs are lost with the job.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: prism-regression-cpu-work
        path: |
          src/tests/prism/regression/**/work-cpu/digest.txt
          src/tests/prism/regression/**/work-cpu/*-residuals.dat
        if-no-files-found: warn
        retention-days: 14

  regression-flume-cpu:
    # FLUME CPU regression suite (issue #35, P8): V1 Sod x/y/z, V2 vortex, V3 AMR + reflux, V6 shock-cylinder with the
    # immersed boundary. The FNL goldens are checked locally (run-fnl-local.sh): the hosted runners have no GPU.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: fobis fetch

    - name: Install FFTW
      # The self-gravity cases run on adam_flume_cpu_fft (flume-cpu-gnu-fft links -lfftw3; issue #81, P6).
      run: sudo apt install -y libfftw3-dev

    - name: Run FLUME CPU regression
      # The ci_gnu varset (fobos) points HDF5 at lib/hdf5/develop/gnu/14.2.0:
      # the runner's apt gfortran-14 cannot read the default local_gnu HDF5,
      # built by gfortran 16.2.
      run: ./src/tests/flume/regression/run.sh cpu --varset ci_gnu

    - name: Check FLUME OpenMP-CPU bitwise against serial
      # The OpenMP build must reproduce the serial one bit for bit on the
      # immersed-boundary case (issue #35: one unexplained single-ulp event on
      # record). np 2 x 2 threads fills the 4-core runner; a failure prints the
      # first divergent iteration and uploads both runs' logs below.
      if: success() || failure()
      run: ./src/tests/flume/regression/run-omp-bitwise.sh --threads 2 --np 2 --varset ci_gnu

    - name: Upload regression work outputs
      # Runs even when the regression step fails: the produced digests and logs
      # are how a golden is (re)captured from a known-good CI run, and how a
      # failing run is diagnosed.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: flume-regression-cpu-work
        path: |
          src/tests/flume/regression/**/work-cpu/digest.txt
          src/tests/flume/regression/**/work-cpu/*-residuals.dat
          src/tests/flume/regression/**/work-cpu/*-conservation_history.dat
          src/tests/flume/regression/**/work-omp-*/digest.txt
          src/tests/flume/regression/**/work-omp-*/*.dat
          src/tests/flume/regression/**/work-omp-*/run.log
        if-no-files-found: warn
        retention-days: 14

  ripple-cpu:
    # RIPPLE, the toy app of the "build your own solver" tutorial (issue #59): the CPU build and its oracles against the
    # exact translated profile (uniform order 5, AMR order 2 with conservation, rank invariance). The FNL leg r4 runs
    # on medooza: the hosted runners have no GPU.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Fetch dependencies
      if: hashFiles('**/.deps_config.ini') != ''
      run: fobis fetch

    - name: Build RIPPLE (CPU)
      run: fobis build --mode ripple-cpu-gnu --varset ci_gnu

    - name: Run the RIPPLE oracles
      run: |
        python3 -m venv exe/.regression-venv
        exe/.regression-venv/bin/pip install --quiet h5py numpy
        ./src/tests/ripple/check.sh --legs r1,r2,r3,r5

  docs-modes:
    # Every `fobis ... --mode X` in the documentation must be a mode the fobos files define (issue #60, P8): commands in
    # a page are not compiled, and the #60 audit found 38 references to modes that did not exist.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Check the build modes named in the docs
      run: python3 scripts/check_docs_modes.py

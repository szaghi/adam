name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env

    - name: Install HDF5 (parallel)
      run: |
        sudo apt install -y libhdf5-openmpi-dev
        HDF5_LIB=$(find /usr/lib -name 'libhdf5.a' -path '*openmpi*' 2>/dev/null | head -1 | xargs dirname)
        HDF5_INC=$(find /usr/include -name 'hdf5.h' -path '*openmpi*' 2>/dev/null | head -1 | xargs dirname)
        mkdir -p lib/hdf5_github/lib lib/hdf5_github/include
        cp "${HDF5_LIB}"/*.a lib/hdf5_github/lib/
        cp "${HDF5_INC}"/* lib/hdf5_github/include/
        # HDF5 >= 1.12 merged libhdf5_f90cstub into libhdf5_fortran; provide empty stub if absent
        [ -f lib/hdf5_github/lib/libhdf5_f90cstub.a ] || ar rcs lib/hdf5_github/lib/libhdf5_f90cstub.a

    - name: Build ADAM
      run: FoBiS.py build -mode nasto-cpu-gnu-github

name: CI

on: push

jobs:
  test-deploy:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GCC_V: 14 # gcc version
      HDF5_V: 1.14.6 # HDF5 version

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: develop
        submodules: 'true'

    - name: Install GCC
      run: |
        sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
        sudo apt update
        sudo apt install -y gcc-${GCC_V} gfortran-${GCC_V} g++-${GCC_V}
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${GCC_V} 100 \
        --slave /usr/bin/gfortran gfortran /usr/bin/gfortran-${GCC_V} \
        --slave /usr/bin/gcov gcov /usr/bin/gcov-${GCC_V}

    - name: Install OPENMPI
      run: |
        sudo apt install openmpi-bin openmpi-common libopenmpi-dev

    - name: Install Graphviz
      uses: ts-graphviz/setup-graphviz@v2

    - name: Install FOBIS-FORD
      run: |
        pip install --upgrade markdown
        pip install --upgrade markdown-include
        pip install --upgrade python-markdown-math
        pip install --upgrade toposort
        pip install --upgrade jinja2
        pip install --upgrade pygments
        pip install --upgrade beautifulsoup4
        pip install --upgrade graphviz
        pip install --upgrade tqdm
        pip install --upgrade importlib-metadata
        pip install --upgrade ford
        pip install --upgrade FoBiS.py

    - name: Check system
      run: |
        echo 'GFORTRAN'
        gfortran --version
        echo
        echo 'MPIF90'
        mpif90 --version
        echo
        echo 'GCOV'
        gcov --version
        echo
        echo 'PYTHON'
        python --version
        echo
        echo 'FOBIS'
        FoBiS.py --version
        echo
        echo 'FORD'
        ford --version

    - name: Build NASTO CPU GNU
      run: |
        FoBiS.py build -mode nasto-cpu-gnu-github
    

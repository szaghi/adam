; RIPPLE oracle 1 (issue #59): u0 = sin(2 pi x) sin(2 pi y) advected at a = (1, 0.5) across the periodic unit square
; to t = 1, where the exact solution is u0(x - a t). 2-D quadtree (ratio 4, nk 1, z null): iu_ref_levels = 2 gives 4x4
; blocks of ni x nj cells. WENO-5 (Jiang-Shu weights), SSP-54 at CFL 0.4. check.sh rewrites ni and nj for
; each grid of the ladder.
[IO]
output_basename        = periodic
it_save                = 0
restart                = .false.
restart_basename       = periodic-restart
restart_save           = 0
residuals_save         = 0
save_memory_status     = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 2
ratio          = 4
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 1

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[ripple]
velocity_x = 1.0
velocity_y = 0.5
velocity_z = 0.0

[time]
it_max   = -1
time_max = 1.0
CFL      = 0.4

; RIPPLE oracle 2 (issue #59): oracle 1 (periodic.ini) with a static 2:1 AMR region. The box marker refines the four
; central blocks of the 4x4 base grid (their centroids in [0.25, 0.75]^2) one level: the profile crosses 2:1 faces,
; edges and corners all the way to t = 1, which takes the staged forest path (the flux register and the end-of-step
; reflux). check.sh rewrites ni, nj for each grid of the ladder.
[IO]
output_basename        = amr
it_save                = 0
restart                = .false.
restart_basename       = amr-restart
restart_save           = 0
residuals_save         = 0
save_memory_status     = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 3
ratio          = 4
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 1

[amr_marker_1]
mode         = 1             ; AMR_GEO (geometric marker)
geo_type     = primitive-box
delta_type   = max           ; unused by the box marker; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = 0.25
box_ymin     = 0.25
box_zmin     = 0.0
box_xmax     = 0.75
box_ymax     = 0.75
box_zmax     = 1.0
target_level = 3

[field]
nv = 1

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[ripple]
velocity_x = 1.0
velocity_y = 0.5
velocity_z = 0.0

[time]
it_max   = -1
time_max = 1.0
CFL      = 0.4

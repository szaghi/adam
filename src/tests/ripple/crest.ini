; RIPPLE oracle 6 (issue #110, P4.5): amr.ini with the refinement criterion of one's own of the build-your-own tutorial.
; The registered criterion "crest" (src/tests/ripple/test_ripple_crest_criterion.F90) refines the blocks of the 4x4 base
; grid where the initial profile u0 = sin(2 pi x) sin(2 pi y) rises above 0.9: the 8 blocks around the two positive
; crests, (0.25, 0.25) and (0.75, 0.75). check.sh rewrites ni, nj; it needs the test driver (fobis mode
; test-ripple-crest-criterion-cpu-gnu).
[IO]
output_basename        = crest
it_save                = 0
restart                = .false.
restart_basename       = crest-restart
restart_save           = 0
residuals_save         = 0
save_memory_status     = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 3
ratio          = 4
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 1

[amr_marker_1]
mode         = 6             ; a registered criterion (AMR_USER), selected by name
name         = crest
delta_type   = max           ; unused by the criterion; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0

[field]
nv = 1

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[ripple]
velocity_x = 1.0
velocity_y = 0.5
velocity_z = 0.0

[time]
it_max   = -1
time_max = 1.0
CFL      = 0.4

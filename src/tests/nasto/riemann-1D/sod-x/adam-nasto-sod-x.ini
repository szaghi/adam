[cuda]
block_x = 1
block_y = 8
block_z = 32

[IO]
output_basename    = sod-x
it_save            = 10
restart            = .false.
restart_basename   = sod-x-restart
restart_save       = 10
save_memory_status = .false.
residuals_save     = 1

[time]
time_max = 0.2
it_max   = -1
CFL      = 0.5

[runge_kutta]
scheme = runge-kutta-3 ; runge-kutta-1 / runge-kutta-2 / runge-kutta-3 / runge-kutta-ssp-22 / runge-kutta-ssp-33 / runge-kutta-ssp-54

[weno]
S                   = 5       ; default WENO (half) stencil lenght
ror_number          = 0       ; number of ror iterations
ror_scheme_1        = 4       ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3       ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2       ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1       ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9     ; ror threshold triggering
ror_vars_number     = 2       ; number of variables to check
ror_ivar_1          = 1       ; index of variable 1
ror_ivar_2          = 7       ; index of variable 2
enable_ror_stats    = .false. ; enable ror statistic saving
ib_reduction_extent = 0       ; extent of order reduction close to IB solids
ib_reduced_order    = 2       ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[grid]
ni     = 100
nj     = 8
nk     = 8
ngc    = 6
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .true.
null_z = .true.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = riemann-problem
regions_number = 2
[initial_conditions_region_1]
r      = 1.0
u      = 0.0
v      = 0.0
w      = 0.0
p      = 1.0
s      = 1
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0
[initial_conditions_region_2]
r      = 0.125
u      = 0.0
v      = 0.0
w      = 0.0
p      = 0.1
s      = 1
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[physics]
ns = 1

[physics_specie_1]
cp  = 1040.004
cv  = 742.86
mu  = 0.0
kd  = 0.0
dha = 0.0

[amr]
max_level      = 0
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0
[amr_marker_1]
mode         = 2 ; grad
delta_fine   = 0.25
delta_coarse = 1.0
field        = 2 ; 1=q, 2=q_aux
var          = 1
tol          = 0.5
[amr_marker_2]
mode          = 1 ; geom
delta_fine    = 0.001
delta_coarse  = 0.02
solid         = 1

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[solids]
number    = 0
n_eikonal = 2
[solid_1]
name            = sphere
bc_type         = 1 ; BCS_VISCOUS
definition      = analytical_sphere
sphere_center_x = 10.0
sphere_center_y = 10.0
sphere_center_z = 10.0
sphere_radius   = 1.0
[solid_2]
name            = sphere
bc_type         = 1 ; BCS_VISCOUS
definition      = analytical_sphere
sphere_center_x = 13.0
sphere_center_y = 13.0
sphere_center_z = 10.0
sphere_radius   = 1.0
[solid_3]
name            = sphere
bc_type         = 1 ; BCS_VISCOUS
definition      = analytical_sphere
sphere_center_x = 13.0
sphere_center_y = 7.0
sphere_center_z = 10.0
sphere_radius   = 1.0

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

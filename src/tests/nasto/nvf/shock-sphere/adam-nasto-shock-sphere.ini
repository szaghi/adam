[IO]
output_basename    = sphere-shock
it_save            = 500
restart            = .false.
restart_basename   = sphere-shock-restart
restart_save       = 500
save_memory_status = .false.
residuals_save     = 10

[time]
time_max = 6.0
it_max   = -1
CFL      = 0.5

[schemes]
time              = runge-kutta-3 ; runge-kutta-1 / runge-kutta-2 / runge-kutta-3
fluxes_convective = weno-upwind   ; weno-upwind / weno-central-2 / weno-central-4 / weno-central-6
fluxes_diffusive  = central-4     ; central-2 / central-4 / central-6

[schemes_weno_upwind]
iweno               = 3       ; default WENO (half) stencil lenght
ror_number          = 0       ; number of ror iterations
ror_scheme_1        = 4       ; scheme for 1 iteration (4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3       ; scheme for 2 iteration (4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2       ; scheme for 3 iteration (4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1       ; scheme for 4 iteration (4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9     ; ror threshold triggering
ror_vars_number     = 2       ; number of variables to check
ror_ivar_1          = 1       ; index of variable 1
ror_ivar_2          = 2       ; index of variable 2
enable_ror_stats    = .false. ; enable ror statistic saving
ib_reduction_extent = 0       ; extent of order reduction close to IB solids
ib_reduced_order    = 2       ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[grid]
ni     = 8
nj     = 8
nk     = 8
ngc    = 4
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 20.0
emax_y = 20.0
emax_z = 20.0

[initial_conditions]
type           = riemann-problem
regions_number = 2
[initial_conditions_region_1]
r      = 5.1432014
u      = 2.0451067615658363
v      = 0.0
w      = 0.0
p      = 9.0454500
s      = 1
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 20.0
emax_z = 20.0
[initial_conditions_region_2]
r      = 1.4
u      = 0.
v      = 0.
w      = 0.
p      = 1.0
s      = 1
emin_x = 1.0
emin_y = 0.0
emin_z = 0.0
emax_x = 20.0
emax_y = 20.0
emax_z = 20.0

[physics]
ns = 1

[physics_specie_1]
; cp       = 1005.2
; cv       = 718.
cp  = 2.5
cv  = 1.78571
mu  = 1.28535e-5
kd  = 4.59053e-5
dha = 0.

[amr]
max_level      = 5
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50
iters          = 1
markers_number = 1
[amr_marker_1]
mode         = 2 ; grad
delta_fine   = 0.25
delta_coarse = 1.0
field        = 2 ; 1=q, 2=q_aux
var          = 1
tol          = 0.5
[amr_marker_2]
mode          = 1 ; geom
delta_fine    = 0.001
delta_coarse  = 0.02
solid         = 1

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = inflow
r    = 5.1432014
u    = 2.0451067615658363
v    = 0.0
w    = 0.0
p    = 9.0454500
s    = 1
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[solids]
number = 1
[solid_1]
name            = sphere
bc_type         = 1 ; BCS_VISCOUS
definition      = analytical_sphere
sphere_center_x = 10.0
sphere_center_y = 10.0
sphere_center_z = 10.0
sphere_radius   = 1.0

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

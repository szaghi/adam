; Input of test_periodic_ghost (FLUME #35, P0-B): only the sections realm_object%initialize reads.
; Anisotropic domain (Lx=1, Ly=2, Lz=3) so an axis mix-up in the periodic wrap cannot cancel out.
[IO]
output_basename        = test_periodic_ghost
it_save                = 999999
restart                = .false.
restart_basename       = test_periodic_ghost-restart
restart_save           = 999999
residuals_save         = 999999
save_memory_status     = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 8
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 2.0
emax_z = 3.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 0

[field]
nv = 1

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

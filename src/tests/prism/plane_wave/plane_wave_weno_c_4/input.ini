[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = weno         ; [weno, centered]
constrained_transport    = DB           ; [no,D,B,DB,BD]
divergence_correction    = hyperbolic   ; [no, hyperbolic, poisson]

[physics]
nv  = 9
chi = 3.0
eta = -1.0

[runge_kutta]
scheme = runge-kutta-3

[weno]
scheme              = weno-c-4
ror_number          = 0            ; number of ror iterations
ror_scheme_1        = 4            ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3            ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2            ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1            ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9          ; ror threshold triggering
ror_vars_number     = 2            ; number of variables to check
ror_ivar_1          = 1            ; index of variable 1
ror_ivar_2          = 7            ; index of variable 2
enable_ror_stats    = .false.      ; enable ror statistic saving
ib_reduction_extent = 0            ; extent of order reduction close to IB solids
ib_reduced_order    = 2            ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[linear-algebra]
smoothing         = multigrid ; [multigrid, gauss-seidel, sor, sor-omp]
iterations_init   = 10
iterations_coarse = 20
iterations_fine   = 5
iterations        = 1000
tolerance         = 0.00000001

[IO]
output_basename    = plane_wave
it_save            = 20
restart            = .false.
restart_basename   = plane_wave-restart
restart_save       = 100
residuals_save     = 10
save_memory_status = .false.

[time]
time_max = 1.5E-8
it_max   = 1000
CFL      = 0.5

[grid]
ni     = 200
nj     = 60
nk     = 60
ngc    = 2
emin_x = -0.1
emin_y = -0.03
emin_z = -0.03
emax_x = 0.1
emax_y = 0.03
emax_z = 0.03
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = plane_wave
regions_number = 0
kx             = 1.0
ky             = 0.0
kz             = 0.0
lambda         = 0.05
B0             = 10.0

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic


; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
time_delay = 8.0E-10

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

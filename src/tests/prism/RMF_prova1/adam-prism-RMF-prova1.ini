[IO]
output_basename    = RMF_prova1
it_save            = 500
restart            = .false.
restart_basename   = RMF_prova1-restart
restart_save       = 500
residuals_save     = 10
save_memory_status = .false.

[time]
time_max = 12.0E-7
it_max   = -1
CFL      = 0.5

[runge_kutta]
scheme = runge-kutta-1 ; runge-kutta-1 / runge-kutta-2 / runge-kutta-3 / runge-kutta-ssp-22 / runge-kutta-ssp-33 / runge-kutta-ssp-54

[weno]
S                   = 1       ; default WENO (half) stencil lenght
ror_number          = 0       ; number of ror iterations
ror_scheme_1        = 4       ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3       ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2       ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1       ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9     ; ror threshold triggering
ror_vars_number     = 2       ; number of variables to check
ror_ivar_1          = 1       ; index of variable 1
ror_ivar_2          = 7       ; index of variable 2
enable_ror_stats    = .false. ; enable ror statistic saving
ib_reduction_extent = 0       ; extent of order reduction close to IB solids
ib_reduced_order    = 2       ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[grid] ;da verificare con Stefano
ni     = 120
nj     = 142
nk     = 142
ngc    = 1 ;per lo schema considerato (1st order) ne basta una
emin_x = -0.06
emin_y = -0.071
emin_z = -0.071
emax_x = 0.06
emax_y = 0.071
emax_z = 0.071
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum
regions_number = 0

[physics]
nv = 9

[amr]
max_level      = 0
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation


; Coils input 
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
time_delay = 1.0E-7
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 ;per farlo come Filippo devi avere dimensione pari a quella della cella e modificare 
          ;calcolo J nella subroutine (sezione quadrata e non circolare) e valutazione dmax nel coil_obj, da porre pari a dx/2
          ;OK
x_center = 0.0
y_center = -0.0305
z_center = 0.0
nx = 0.0
ny = -1.0
nz = 0.0
Amplitude = 100
frequency = 2.5E6
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 
x_center = 0.0
y_center = 0.0305
z_center = 0.0
nx = 0.0
ny = -1.0
nz = 0.0
Amplitude = 100
frequency = 2.5E6
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 
x_center = 0.0
y_center = 0.0
z_center = -0.0305
nx = 0.0
ny = 0.0
nz = 1.0
Amplitude = 100
frequency = 2.5E6
Phase = 0.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 
x_center = 0.0
y_center = 0.0
z_center = 0.0305
nx = 0.0
ny = 0.0
nz = 1.0
Amplitude = 100
frequency = 2.5E6
Phase = 0.0

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0
ly = 0.04
d = 0.001 
x_center = 0.0
y_center = 0.0
z_center = -0.0305
normal = 0 0 1 
Amplitude = 100
frequency = 2.5E6
Phase = 0.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 
x_center = 0.0
y_center = 0.0
z_center = 0.0305
normal = 0 0 -1 
Amplitude = 100
frequency = 2.5E6
Phase = 0.0


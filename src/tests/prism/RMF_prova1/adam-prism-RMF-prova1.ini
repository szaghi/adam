; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation


; Coils input 
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 ;per farlo come Filippo devi avere dimensione pari a quella della cella e modificare 
          ;calcolo J nella subroutine (sezione quadrata e non circolare) e valutazione dmax nel coil_obj, da porre pari a dx/2
x_center = 0.0
y_center = -0.0305
z_center = 0.0
normal = 0 -1 0 ;chiedi se puoi dare un vettore in input, altrimenti dividi per componenti come per il centro
Amplitude = 100
frequency = 2.5E6
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.05
ly = 0.04
d = 0.001 
x_center = 0.0
y_center = 0.0305
z_center = 0.0
normal = 0 -1 0 
Amplitude = 100
frequency = 2.5E6
Phase = 0.0
[coils_input_coil_3]

[grid] ;da verificare con Stefano
ni     = 120
nj     = 142
nk     = 142
ngc    = 1 ;per la bc imposta dovrebbe bastarne 1
emin_x = -0.06
emin_y = -0.072
emin_z = -0.072
emax_x = 0.06
emax_y = 0.072
emax_z = 0.072

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum
regions_number = 0

[physics]
nv = 9


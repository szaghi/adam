[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta] (leapfrog, blanes_moan, commutator_free_magnus: refused, moved to SELAH)
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = D            ; [no,D,B,DB,BD]
divergence_correction    = hyperbolic   ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM
chi = 1.0

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename        = RMF_nom_divD
it_save                = 19000
restart                = .false.
restart_basename       = RMF_nom_divD-restart
restart_save           = 1000
residuals_save         = 500
save_memory_status     = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = -1E-5
it_max   = 627000
CFL      = 0.493078947368421

[grid]
ni     = 180
nj     = 180
nk     = 180
ngc    = 3
emin_x = -0.09
emin_y = -0.09
emin_z = -0.09
emax_x = 0.09
emax_y = 0.09
emax_z = 0.09
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0 ; physical layer width (0 = inactive); was the removed cell count C = 0 (issue #58)
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0 ; required since 8462f6b1 (helicon coils); 0 = this input as written (issue #58)
helicon_coils_number  = 0 ; required since 8462f6b1; 0 = this input as written (issue #58)
time_delay = 1.5625E-8
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.06
ly = 0.06
sigma = 0.002
x_center = 0.000
y_center = 0.040
z_center = 0.000
normal = +y
Amplitude = 250
Frequency = 2.0E6
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.06
ly = 0.06
sigma = 0.002
x_center = 0.000
y_center = -0.040
z_center = 0.000
normal = +y
Amplitude = 250
Frequency = 2.0E6
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.06
ly = 0.06
sigma = 0.002
x_center = 0.040
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 250
Frequency = 2.0E6
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.06
ly = 0.06
sigma = 0.002
x_center = -0.040
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 250
Frequency = 2.0E6
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

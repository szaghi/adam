[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta] (leapfrog, blanes_moan, commutator_free_magnus: refused, moved to SELAH)
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = pml
it_save            = 100000
restart            = .false.
restart_basename   = pml-restart
restart_save       = 100000
residuals_save     = 10
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = -1.5E-8
it_max   = 1000
CFL      = 0.5

[grid]
ni     = 100
nj     = 3
nk     = 3
ngc    = 3
emin_x = -0.1
emin_y = -0.003
emin_z = -0.003
emax_x = 0.1
emax_y = 0.003
emax_z = 0.003
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations   = 0 ; number of AMR update/set IC iterations
type             = gaussian_pulse
k0               = 0.0;2093.0
r0               = 0.0
pulse_direction  = +x
sigma            = 0.004
B0               = 10.0

[amr]
max_level      = 1
ratio          = 8
iu_ref_levels  = 1
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = PEC
[bc_x_max]
type = PEC
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0 ;physical width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[PML]
PML_type       = classic
width          = 0.02
x_minus_layer  = .true.
x_plus_layer   = .true.
y_minus_layer  = .false.
y_plus_layer   = .false.
z_minus_layer  = .false.
z_plus_layer   = .false.
gamma_max      = 7.8E10
gamma_exponent = 2.0

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

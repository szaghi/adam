[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename       = RMF_double_saddle_DC_grms_Neumann_big
it_save               = 600
restart               = .false.
restart_basename      = RMF_double_saddle_DC_grms_Neumann_big-restart
restart_save          = 500
residuals_save        = 100
save_memory_status    = .false.
save_residual_fields  = .true.
save_curl_fields      = .false.
save_divergence_fields = .true.

[grms]
save_history = .true.
history_save = 100
region_type = all ; if omitted, the code defaults to the full valid domain

[magnetic_field_at_center_domain]
save_history = .true.
history_save = 10

[time]
time_max = 1E-5
it_max   = 6600
CFL      = 0.499666666666666

[grid]
ni     = 24
nj     = 24
nk     = 30
ngc    = 3
emin_x = -0.192
emin_y = -0.192
emin_z = -0.240
emax_x = 0.192
emax_y = 0.192
emax_z = 0.240
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 3
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 2
time_delay = 1e-08
[coils_input_coil_1]
coil_type = helicon
current_type = DC_current
sigma = 0.002
x_center = 0.000
y_center = 0.000
z_center = 0.000
normal = +z
r_coil = 0.025
Amplitude = 50
N_points = 5
x_point_1 = 0.0125
y_point_1 = -0.0216506350946
z_point_1 = 0.05
x_point_2 = 0.0125
y_point_2 = -0.0216506350946
z_point_2 = -0.05
x_point_3 = 0.0125
y_point_3 = 0.0216506350946
z_point_3 = -0.05
x_point_4 = 0.0125
y_point_4 = 0.0216506350946
z_point_4 = 0.05
x_point_5 = 0.0125
y_point_5 = -0.0216506350946
z_point_5 = 0.05
[coils_input_coil_2]
coil_type = helicon
current_type = DC_current
sigma = 0.002
x_center = 0.000
y_center = 0.000
z_center = 0.000
normal = +z
r_coil = 0.025
Amplitude = 50
N_points = 5
x_point_1 = -0.0125
y_point_1 = 0.0216506350946
z_point_1 = 0.05
x_point_2 = -0.0125
y_point_2 = -0.0216506350946
z_point_2 = 0.05
x_point_3 = -0.0125
y_point_3 = -0.0216506350946
z_point_3 = -0.05
x_point_4 = -0.0125
y_point_4 = 0.0216506350946
z_point_4 = -0.05
x_point_5 = -0.0125
y_point_5 = 0.0216506350946
z_point_5 = 0.05

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

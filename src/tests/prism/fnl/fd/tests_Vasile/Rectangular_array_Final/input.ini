[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename       = RMF_rectangular_array_Final
it_save               = 3000
restart               = .false.
restart_basename      = RMF_rectangular_array_Final-restart
restart_save          = 10000
residuals_save        = 100
save_memory_status    = .false.
save_residual_fields  = .false.
save_curl_fields      = .false.
save_divergence_fields = .false.

[grms]
save_history = .true.
history_save = 100
region_type = cylinder ; if omitted, the code defaults to the full valid domain
center_x = 0.0
center_y = 0.0
center_z = 0.0
axis_x = 0.0
axis_y = 0.0
axis_z = 1.0
radius = 0.015
length = 0.05

[magnetic_field_at_center_domain]
save_history = .true.
history_save = 10

[time]
time_max = 5.555000e-08
it_max   = 66000
CFL      = 0.499666666666666

[grid]
ni     = 60
nj     = 60
nk     = 75
ngc    = 3
emin_x = -0.24
emin_y = -0.24
emin_z = -0.3
emax_x = 0.24
emax_y = 0.24
emax_z = 0.3
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 3
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = PEC
[bc_x_max]
type = PEC
[bc_y_min]
type = PEC
[bc_y_max]
type = PEC
[bc_z_min]
type = PEC
[bc_z_max]
type = PEC

[fWLayer]
width = 0.0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
; Coils input (geometry from Ansys Maxwell Final.aedtresults)
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0
helicon_coils_number = 0
time_delay = 1.500000e-08
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.040
ly = 0.050
sigma = 0.002
x_center = 0
y_center = 0.028
z_center = 0
normal = +y
Amplitude = 100
Frequency = 25000000
Phase = 0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.040
ly = 0.050
sigma = 0.002
x_center = 0
y_center = -0.028
z_center = 0
normal = +y
Amplitude = 100
Frequency = 25000000
Phase = 0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.040
ly = 0.050
sigma = 0.002
x_center = 0.028
y_center = 0
z_center = 0
normal = +x
Amplitude = 100
Frequency = 25000000
Phase = -90
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.040
ly = 0.050
sigma = 0.002
x_center = -0.028
y_center = 0
z_center = 0
normal = +x
Amplitude = 100
Frequency = 25000000
Phase = -90

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0

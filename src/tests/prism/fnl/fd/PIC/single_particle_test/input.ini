[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = single_particle
initialization = coherent
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
particle_weighting_model = gaussian
current_weighting_model  = gaussian
sigma = 0.0004
cutoff_sigma = 3.0
field_weighting_model = gaussian
scheme_time = runge_kutta

[particle_injection]
x_position = 0.0003847083
y_position = 0.000904369
z_position = 0.000804679
v_drift_x  = 10000000
v_drift_y  = 0.0
v_drift_z  = 0.0
mass       = 9.11e-30
charge     = -1.6e-19;19

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = single_particle
it_save            = 100
restart            = .false.
restart_basename   = single_particle-restart
restart_save       = 100
residuals_save     = 1
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = 2.5E-6
it_max   = 1
CFL      = 0.5

[grid]
ni     = 50
nj     = 50
nk     = 50
ngc    = 6
emin_x = -0.01
emin_y = -0.01
emin_z = -0.01
emax_x = 0.01
emax_y = 0.01
emax_z = 0.01
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = uniform_field
B_x            = 0.0
B_y            = 0.0
B_z            = 0.0

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

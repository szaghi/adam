[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = B            ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = single_particle
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
filter_deposition = .false.
particle_weighting_model = TSC
current_weighting_model  = conserving
current_conserving_solver = esirkepov_Q5
esirkepov_tail_cleanup = .true.    ; threshold 1e-11 outside each particle's matched-current support
field_weighting_model = 2D
scheme_time = runge_kutta

[particle_injection]
x_position = -0.0045
y_position = -0.0045
z_position = 0.00014
v_drift_x  = 1000000
v_drift_y  = 10.0
v_drift_z  = 10.0
mass       = 9.11e-30
charge     = -1.6e-19

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = conserving_test_TSC_Q5
it_save            = 500
restart            = .false.
restart_basename   = conserving_test_TSC_Q5-restart
restart_save       = 200
residuals_save     = 10
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = 2.5E-6
it_max   = 5000
CFL      = 0.5

[grid]
ni     = 40
nj     = 40
nk     = 40
ngc    = 6
emin_x = -0.016
emin_y = -0.016
emin_z = -0.016
emax_x = 0.016
emax_y = 0.016
emax_z = 0.016
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = uniform_field
B_x            = 0.0
B_y            = 0.0
B_z            = 0.0

[amr]
max_level      = 1
ratio          = 8
iu_ref_levels  = 1
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = PEC
[bc_x_max]
type = PEC
[bc_y_min]
type = PEC
[bc_y_max]
type = PEC
[bc_z_min]
type = PEC
[bc_z_max]
type = PEC

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = No ; [RMF, Uniform_field, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

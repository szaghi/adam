[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = plasma
plasma_domain = slab
slab_normal = x
slab_thickness = 0.0177312469
slab_center = 0.4558718478
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
elliptic_initialization_closure = isolated
filter_deposition = .false.
particle_weighting_model = TSC
current_weighting_model  = conserving
current_conserving_solver = esirkepov_Q10
esirkepov_tail_cleanup = .false.
field_weighting_model = esirkepov_Q10 ; coherent gather of the deposit
scheme_time = runge_kutta
plasma_density = 2.000000e+18 ; n_e = n_i = 1e+18: c/w_pe = 5.3215 mm
particle_weight = 1167971.785 ; 14 macroparticles per cell per species (dx = delta/16, dy = dz = delta/24)
neutral_fraction = 0.0
particle_capacity_factor = 2.5 ; particle arrays of a rank: 2.5 x global/ranks (the slab lies on a fraction of the ranks)

[particle_injection]
random_seed = 12345
space_random_number_generator = layered ; linear baseline 2026-11-10: T = 0 + pairing + layered
space_pairing = yes
electrons_velocity_distribution = maxwellian
ions_velocity_distribution = maxwellian
neutrals_velocity_distribution = pure_drift
ionic_temperature = 0.0
electronic_temperature = 0.0
velocity_random_number_generator = random ;layered
velocity_pairing = no
electrons_drift_x  = 0.0
electrons_drift_y  = 0.0
electrons_drift_z  = 0.0
ions_drift_x  = 0.0
ions_drift_y  = 0.0
ions_drift_z  = 0.0
neutrals_drift_x  = 0.0
neutrals_drift_y  = 0.0
neutrals_drift_z  = 0.0
v_av_correction = yes

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = fresnel
it_save            = 3810
restart            = .false.
restart_basename   = fresnel-restart
restart_save       = 3810
residuals_save     = 3810
save_memory_status = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.

[time]
time_max = 1.0
it_max   = 7620
CFL      = 0.5

[grid]
ni     = 234
nj     = 6
nk     = 6
ngc    = 6
emin_x = 0.0
emin_y = -0.005321502671
emin_z = -0.005321502671
emax_x = 0.6226158125
emax_y = 0.005321502671
emax_z = 0.005321502671
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations  = 0 ; number of AMR update/set IC iterations
type            = gaussian_derivative_pulse
B0              = 3.207634e-03 ; envelope |B| [T]: a0 = e B0/(m_e w0) = 0.02
k0              = 93.9584232 ; carrier w0 = 0.5 w_pe (4.483 GHz), lambda0 = 12.57 c/w_pe
r0              = 0.2235031122 ; packet centre: 42 c/w_pe from the x_min wall
sigma           = 0.03192901602 ; 6 c/w_pe, k0 sigma = 3
pulse_direction = +x

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 3
memory_fraction = 0.75 ; blocks budget: the ghost maps of 64 thin blocks per rank (ngc 6) take ~2.4 GB per GPU
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
; Dirichlet
[bc_x_min]
type = PEC
[bc_x_max]
type = PEC
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[PML]
PML_type = none

[probes]
save_every = 6
; plane front: x = 82.0312 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_1 = x 4.3652951595e-01 48 48
; plane inside depth 0.3332: x = 84.3438 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_2 = x 4.4883549087e-01 48 48
; plane inside depth 0.9996: x = 84.9688 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_3 = x 4.5216143004e-01 48 48
; plane inside depth 1.666: x = 85.6562 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_4 = x 4.5581996313e-01 48 48
; plane inside depth 2.332: x = 86.3438 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_5 = x 4.5947849621e-01 48 48
; plane inside depth 2.999: x = 86.9688 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_6 = x 4.6280443538e-01 48 48
; plane rear: x = 89.3438 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_7 = x 4.7544300422e-01 48 48

[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

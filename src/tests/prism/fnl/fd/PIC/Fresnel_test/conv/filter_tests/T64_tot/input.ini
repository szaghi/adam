[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = plasma
plasma_domain = slab
slab_normal = x
slab_thickness = 0.0177312469
slab_center = 0.2164042276
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
elliptic_initialization_closure = isolated
filter_deposition = .false.
particle_weighting_model = TSC
current_weighting_model  = conserving
current_conserving_solver = totorica
esirkepov_tail_cleanup = .false.
field_weighting_model = totorica ; coherent gather of the deposit
scheme_time = runge_kutta
plasma_density = 2.000000e+18 ; n_e = n_i = 1e+18: c/w_pe = 5.3215 mm
particle_weight = 291992.9463 ; 14 macroparticles per cell per species (dx = delta/64, dy = dz = delta/24)
neutral_fraction = 0.0
particle_capacity_factor = 5 ; particle arrays of a rank: 5 x global/ranks (the slab lies on a fraction of the ranks)

[particle_injection]
random_seed = 12345
space_random_number_generator = random ;layered
space_pairing = no
electrons_velocity_distribution = maxwellian
ions_velocity_distribution = maxwellian
neutrals_velocity_distribution = pure_drift
ionic_temperature = 300
electronic_temperature = 30000
velocity_random_number_generator = random ;layered
velocity_pairing = no
electrons_drift_x  = 0.0
electrons_drift_y  = 0.0
electrons_drift_z  = 0.0
ions_drift_x  = 0.0
ions_drift_y  = 0.0
ions_drift_z  = 0.0
neutrals_drift_x  = 0.0
neutrals_drift_y  = 0.0
neutrals_drift_z  = 0.0
v_av_correction = yes

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1

[IO]
unused_keys = warn ; not swept in #80 P5 (an FNL-only PIC case larger than the sweep could run): remove once its unread keys are cleaned
output_basename    = fresnel
it_save            = 5968
restart            = .false.
restart_basename   = fresnel-restart
restart_save       = 5968
residuals_save     = 5968
save_memory_status = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = 1.0
it_max   = 11936
CFL      = 0.5

[grid]
ni     = 464
nj     = 6
nk     = 6
ngc    = 6
emin_x = 0.0
emin_y = -0.005321502671
emin_z = -0.005321502671
emax_x = 0.3086471549
emax_y = 0.005321502671
emax_z = 0.005321502671
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations  = 0 ; number of AMR update/set IC iterations
type            = gaussian_derivative_pulse
B0              = 9.622903e-03 ; envelope |B| [T]: a0 = e B0/(m_e w0) = 0.01
k0              = 563.7505392 ; carrier w0 = 3 w_pe (26.9 GHz), lambda0 = 2.094 c/w_pe
r0              = 0.09578704807 ; packet centre: 18 c/w_pe from the x_min wall
sigma           = 0.01596450801 ; 3 c/w_pe, k0 sigma = 9
pulse_direction = +x

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 3
memory_fraction = 0.75 ; blocks budget: the ghost maps of 64 thin blocks per rank (ngc 6) take ~2.4 GB per GPU
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
; Dirichlet
[bc_x_min]
type = PEC
[bc_x_max]
type = PEC
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[PML]
PML_type = none

[probes]
save_every = 16
; plane front: x = 37.0078 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_1 = x 1.9693717305e-01 48 48
; plane inside depth 0.3332: x = 39.3359 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_2 = x 2.0932629646e-01 48 48
; plane inside depth 0.9996: x = 39.9922 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_3 = x 2.1281853258e-01 48 48
; plane inside depth 1.666: x = 40.6641 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_4 = x 2.1639391719e-01 48 48
; plane inside depth 2.332: x = 41.3359 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_5 = x 2.1996930180e-01 48 48
; plane inside depth 2.999: x = 41.9922 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_6 = x 2.2346153792e-01 48 48
; plane rear: x = 44.3359 c/w_pe (cell centre), one probe per transverse cell (48x48)
plane_7 = x 2.3593380981e-01 48 48

[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

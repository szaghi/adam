[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = plasma
plasma_domain = slab
slab_normal = x
slab_thickness = 0.0177312469
slab_center = 0.2323687356
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
elliptic_initialization_closure = isolated
filter_deposition = .false.
particle_weighting_model = TSC
current_weighting_model  = conserving
current_conserving_solver = esirkepov_Q10
esirkepov_tail_cleanup = .false.
field_weighting_model = esirkepov_Q10 ; coherent gather of the deposit
scheme_time = runge_kutta
plasma_density = 2.000000e+18 ; n_e = n_i = 1e+18: c/w_pe = 5.3215 mm
particle_weight = 1313968.258 ; 28 macroparticles per cell per species
neutral_fraction = 0.0

[particle_injection]
random_seed = 12345
space_random_number_generator = random ;layered
space_pairing = no
electrons_velocity_distribution = maxwellian
ions_velocity_distribution = maxwellian
neutrals_velocity_distribution = pure_drift
ionic_temperature = 300
electronic_temperature = 30000
velocity_random_number_generator = random ;layered
velocity_pairing = no
electrons_drift_x  = 0.0
electrons_drift_y  = 0.0
electrons_drift_z  = 0.0
ions_drift_x  = 0.0
ions_drift_y  = 0.0
ions_drift_z  = 0.0
neutrals_drift_x  = 0.0
neutrals_drift_y  = 0.0
neutrals_drift_z  = 0.0
v_av_correction = yes

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0            ; number of ror iterations
ror_scheme_1        = 4            ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3            ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2            ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1            ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9          ; ror threshold triggering
ror_vars_number     = 2            ; number of variables to check
ror_ivar_1          = 1            ; index of variable 1
ror_ivar_2          = 7            ; index of variable 2
enable_ror_stats    = .false.      ; enable ror statistic saving
ib_reduction_extent = 0            ; extent of order reduction close to IB solids
ib_reduced_order    = 2            ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[IO]
output_basename    = fresnel
it_save            = 376
restart            = .false.
restart_basename   = fresnel-restart
restart_save       = 376
residuals_save     = 376
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = 1.0
it_max   = 2980
CFL      = 0.5

[grid]
ni     = 252
nj     = 8
nk     = 8
ngc    = 6
emin_x = 0.0
emin_y = -0.005321502671
emin_z = -0.005321502671
emax_x = 0.3352546682
emax_y = 0.005321502671
emax_z = 0.005321502671
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations  = 0 ; number of AMR update/set IC iterations
type            = gaussian_derivative_pulse
B0              = 9.622903e-03 ; envelope |B| [T]: a0 = e B0/(m_e w0) = 0.01
k0              = 563.7505392 ; carrier w0 = 3 w_pe (26.9 GHz), lambda0 = 2.094 c/w_pe
r0              = 0.1117515561 ; packet centre: 21 c/w_pe from the x_min wall
sigma           = 0.01596450801 ; 3 c/w_pe, k0 sigma = 9
pulse_direction = +x

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
; Dirichlet
[bc_x_min]
type = PEC
[bc_x_max]
type = PEC
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[PML]
PML_type = none

[probes]
save_every = 4
; plane front: x = 40.0312 c/w_pe (cell centre), one probe per transverse cell (32x32)
; plane inside depth 0.3332: x = 42.3438 c/w_pe (cell centre), one probe per transverse cell (32x32)
; plane inside depth 0.9996: x = 42.9688 c/w_pe (cell centre), one probe per transverse cell (32x32)
; plane inside depth 1.666: x = 43.6562 c/w_pe (cell centre), one probe per transverse cell (32x32)
; plane inside depth 2.332: x = 44.3438 c/w_pe (cell centre), one probe per transverse cell (32x32)
; plane inside depth 2.999: x = 44.9688 c/w_pe (cell centre), one probe per transverse cell (32x32)
; plane rear: x = 47.3438 c/w_pe (cell centre), one probe per transverse cell (32x32)
plane_1 = x 2.1302640380e-01 32 32
plane_2 = x 2.2533237870e-01 32 32
plane_3 = x 2.2865831790e-01 32 32
plane_4 = x 2.3231685100e-01 32 32
plane_5 = x 2.3597538400e-01 32 32
plane_6 = x 2.3930132320e-01 32 32
plane_7 = x 2.5193989210e-01 32 32

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

[IO]
output_basename    = centered
it_save            = 50
restart            = .false.
restart_basename   = centered-restart
restart_save       = 100
residuals_save     = 10
save_memory_status = .false.

[time]
time_max = 1.5E-8
it_max   = -1
CFL      = 0.1

[linear-algebra]
smoothing         = multigrid ; gauss-seidel ; sor ; sor-omp
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 0.0000000000000000000001

[runge_kutta]
scheme = runge-kutta-3 ; runge-kutta-1 / runge-kutta-2 / runge-kutta-3 / runge-kutta-ssp-22 / runge-kutta-ssp-33 / runge-kutta-ssp-54 / runge-kutta-yoshida

[weno]
S                   = 3       ; default WENO (half) stencil lenght
ror_number          = 0       ; number of ror iterations
ror_scheme_1        = 4       ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3       ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2       ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1       ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9     ; ror threshold triggering
ror_vars_number     = 2       ; number of variables to check
ror_ivar_1          = 1       ; index of variable 1
ror_ivar_2          = 7       ; index of variable 2
enable_ror_stats    = .false. ; enable ror statistic saving
ib_reduction_extent = 0       ; extent of order reduction close to IB solids
ib_reduced_order    = 2       ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[grid]
ni     = 142
nj     = 142
nk     = 120
ngc    = 3 ;per lo schema considerato (1st order) ne basta una
emin_x = -0.071
emin_y = -0.071
emin_z = -0.06
emax_x = 0.071
emax_y = 0.071
emax_z = 0.06
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum
regions_number = 0

[physics]
nv = 9
weno_rec_var = conservative
divergence_correction = No ; Poisson / Hyperbolic
d_divergence_cleaner = .false.
b_divergence_cleaner = .false.
chi = 3.0
eta = -1.0

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = fWLayer
[bc_x_max]
type = fWLayer
[bc_y_min]
type = fWLayer
[bc_y_max]
type = fWLayer
[bc_z_min]
type = fWLayer
[bc_z_max]
type = fWLayer


; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 1
time_delay = 8.0E-10
[coils_input_coil_1]
coil_type = rectangular
current_type = DC_current
coil_representation = Finite
current_distribution = Constant ; Constant / Gaussian
lx = 0.04
ly = 0.05
d = 0.001 ;per farlo come Filippo devi avere dimensione pari a quella della cella e modificare
r_c = 0.007 ; radius of curvature for rectangular coil
x_center = 0.0005
y_center = 0.0005
z_center = 0.0005
nx = 0.0
ny = 1.0
nz = 0.0
Amplitude = 100

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

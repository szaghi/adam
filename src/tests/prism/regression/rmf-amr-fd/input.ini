; rmf-amr-fd — single-realm PRISM case with a STATIC intra-realm 2:1 AMR jump,
; under scheme_space=fd_centered (the Phase-B-relevant scheme).
;
; Issue #13 Phase B: the FD-centered B-update is dq(B) = -curl_h(D) and the div(B)
; diagnostic is div_h(B); both are built from the SAME centered stencil
; (compute_derivative1_fd_centered / FD1_CC), so d/dt div_h(B) = div_h(-curl_h D)
; = 0 to round-off on a uniform grid (matched div/curl pair). At a 2:1 coarse-fine
; seam the coarse and fine curl_h(D) read each other's ghosts via 0th-order
; injection -> the two one-sided stencils are not the same operator -> a dt-rate
; div(B) source is injected at seam cells. Phase B shares a canonical D across the
; seam so the cancellation is restored.
;
; This case is the fd_centered sibling of rmf-amr (which stays fv_centered for the
; reflux test). Same grid, same AMR box, same coils -> same seam geometry; only the
; spatial scheme differs. The box covers x<0, refining those blocks one level for a
; 2:1 jump across x=0.

[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0
ror_scheme_1        = 4
ror_scheme_2        = 3
ror_scheme_3        = 2
ror_scheme_4        = 1
ror_threshold       = 0.9
ror_vars_number     = 2
ror_ivar_1          = 1
ror_ivar_2          = 7
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = multigrid ; [multigrid, gauss-seidel, sor, sor-omp]
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 0.0000000000000000000001

[IO]
output_basename        = rmf_amr_fd_regression
it_save                = 5
restart                = .false.
restart_basename       = HF_fnl-restart
restart_save           = 500
residuals_save         = 1
divergence_history_save = 1   ; per-step div history so the Phase-B seam-div(B) test sees growth
save_memory_status     = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = -1E-5
it_max   = 5
CFL      = 0.5

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.06
emax_y = 0.06
emax_z = 0.06
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 1 ; >=1 so the IC-time amr_update fires the box marker once
type           = vacuum
regions_number = 0

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 1
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 1

[amr_marker_1]
mode         = 1            ; AMR_GEO (geometric marker)
geo_type     = primitive-box
delta_type   = max          ; unused by the box marker; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = -0.06        ; refine the x<0 half of the domain
box_ymin     = -0.06
box_zmin     = -0.06
box_xmax     =  0.0
box_ymax     =  0.06
box_zmax     =  0.06
target_level = 2            ; refine in-box blocks up to (below) level 2

; BC types: inflow / extrapolation / wall-inviscid / Silver_Muller / Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0
helicon_coils_number = 0
time_delay = 1.0E-19
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0

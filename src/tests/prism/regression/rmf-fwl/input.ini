[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = rmf_fwl_regression
it_save            = 5
restart_basename   = HF_fnl-restart
restart_save       = 500
residuals_save     = 1
save_residual_fields   = .true.
save_divergence_fields = .true.

[time]
time_max = -1E-5
it_max   = 10
CFL      = 0.499666666666666

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.24
emin_y = -0.24
emin_z = -0.24
emax_x = 0.24
emax_y = 0.24
emax_z = 0.24

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
frequency      = 999999

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.045 ;physical width of the layer; 64 leaf blocks (4^3) over [-0.24,0.24]
              ;=> block extent 0.12, ds = 0.12/16 = 0.0075, so 0.045 = 6 cells (the former C = 6)
x_minus_layer = yes
x_plus_layer  = yes
y_minus_layer = yes
y_plus_layer  = yes
z_minus_layer = yes
z_plus_layer  = yes

; Coils input
[coils_input]
time_delay = 1.0E-8
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.5E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.5E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.5E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.5E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]


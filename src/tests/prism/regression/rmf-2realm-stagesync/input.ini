; PRISM forest manifest — two-realm x-split rmf regression case, β (stage-coincident).
;
; PRD #18 M5: validates β (CADENCE_STAGE_COINCIDENT) seam coupling. The
; geometry mirrors rmf-2realm: x-split at x=0, two adjacent realms whose
; union reconstructs the single-realm rmf domain bit-for-bit. The
; manifest declares `coupling_cadence = stage_coincident` on face_1; the
; forest fills inter-realm seam ghosts at every RK substage (Phase 2
; inside the K loop) rather than once per step.
;
; β admissibility (enforced by `check_beta_admissibility` at forest
; init): both realms must agree on (numerics%scheme_time, rk%scheme,
; physics%nv, K). Both realm INIs use runge-kutta-ssp-54 (K=5) and
; identical physics; only the spatial decomposition splits them.
;
; Strong oracle: the case's digest must match the single-realm `rmf`
; golden bit-for-bit (within rtol=1e-06, atol=1e-3). Enforced
; continuously by `run.sh` (issue #18 M6).

[forest]
realms_number = 2

[realm.1]
ini = realm_1.ini    ; x ∈ [-0.06, 0]

[realm.2]
ini = realm_2.ini    ; x ∈ [0,  0.06]

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +x                  ; realm 1's +x face is glued to realm 2's -x face
realm_b          = 2
face_b           = -x
coupling         = mirror              ; pass-through copy
coupling_cadence = stage_coincident    ; β: per-substage seam fill (issue #18)

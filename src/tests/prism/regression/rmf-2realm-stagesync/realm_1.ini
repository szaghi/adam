; PRISM realm 1 input — left half of the x-split rmf domain (β / stage-coincident).
;
; Cell-grid alignment with the single-realm rmf is preserved by halving
; ni (8 instead of 16) and halving emax_x (0 instead of +0.06): the
; per-cell dxyz equals 0.001875 in every direction, matching single-realm
; rmf exactly. The union of realm_1 and realm_2 cell centers reconstructs
; the single-realm rmf cell-center set.
;
; β admissibility: runge-kutta-ssp-54 (K=5), identical to realm_2;
; physics nv and var_* identical to realm_2 (issue #18).
;
; Every other section is byte-identical to src/tests/prism/regression/rmf-2realm/realm_1.ini.

[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0            ; number of ror iterations
ror_scheme_1        = 4            ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3            ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2            ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1            ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9          ; ror threshold triggering
ror_vars_number     = 2            ; number of variables to check
ror_ivar_1          = 1            ; index of variable 1
ror_ivar_2          = 7            ; index of variable 2
enable_ror_stats    = .false.      ; enable ror statistic saving
ib_reduction_extent = 0            ; extent of order reduction close to IB solids
ib_reduced_order    = 2            ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[linear-algebra]
smoothing         = multigrid ; [multigrid, gauss-seidel, sor, sor-omp]
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 0.0000000000000000000001

[IO]
output_basename        = rmf_2realm_r1
it_save                = 5
restart                = .false.
restart_basename       = HF_fnl-restart_r1
restart_save           = 500
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = -1E-5
it_max   = 10
CFL      = 0.5

[grid]
ni     = 8
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.0
emax_y = 0.06
emax_z = 0.06
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum
regions_number = 0

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
C = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
time_delay = 1.0E-19
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

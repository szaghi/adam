;; PRISM regression: periodic BC across blocks and ranks (library periodicity, particle_bc F0).
;; Gaussian pulse (k0 = 0, sigma = 0.015) along +x in the periodic box [-0.1,0.1]^3, 48^3 cells as 64 blocks of 12^3
;; (iu_ref_levels = 2), split 32/32 on the harness's 2 ranks. dt = dx/(4c), so it_max = 192 is exactly one period: the
;; pulse crosses the x faces between blocks owned by different ranks and returns. Single-block 48^3 agrees to ~2e-15.
[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = periodic_pulse_blocks 
it_save            = 48 
restart_basename   = periodic_pulse_blocks-restart 
restart_save       = 100000 
residuals_save     = 1 

[time]
time_max = -1.0 
it_max   = 192 
CFL      = 0.5

[grid]
ni     = 12
nj     = 12
nk     = 12
ngc    = 3
emin_x = -0.1 
emin_y = -0.1 
emin_z = -0.1 
emax_x = 0.1 
emax_y = 0.1 
emax_z = 0.1 

[initial_conditions]
amr_iterations   = 0 ; number of AMR update/set IC iterations
type             = gaussian_pulse
k0               = 0.0 ;2093.0
r0               = 0.07 
pulse_direction  = +x 
sigma            = 0.015 
B0               = 10.0

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
frequency      = 50000

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0 ;physical width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]


; PRISM forest manifest — two-realm x-split rmf regression case, ASYMMETRIC K.
;
; PRD #16 M7: validates the α end-of-step barrier under per-realm K.
; Realm_1 uses runge-kutta-ssp-33 (K=3); realm_2 uses runge-kutta-ssp-54
; (K=5). Both advance with the same global dt (forest min-reduction). This
; case exercises the K-equality guard removal (#16 M1) — without it the
; forest would error_stop on K_realm(1) /= K_max(=5).
;
; The geometry mirrors src/tests/prism/regression/rmf-2realm: x-split at
; x=0 with a single inter-realm seam. The α end-of-step seam fill copies
; the peer's committed q once per global step; mid-step peer ghosts hold
; the previous end-of-step value (AMReX FillCoarsePatch convention).

[forest]
realms_number = 2

[realm.1]
ini = realm_1.ini    ; x ∈ [-0.06, 0]

[realm.2]
ini = realm_2.ini    ; x ∈ [0,  0.06]

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a  = 1
face_a   = +x        ; realm 1's +x face is glued to realm 2's -x face
realm_b  = 2
face_b   = -x
coupling = mirror    ; pass-through copy; the only kind v1 implements

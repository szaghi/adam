; rmf-2realm-fv-pulse-blocks — forest manifest (issue #51): the 1:1 mirror pulse split at x = 0 on the FV path,
; with the seam blocks of the two realms not lined up (check.sh). The FV register must carry the fine skins of
; misaligned blocks into the right register faces: max|F_coarse-F_fine_sum| = 0 on a mirror seam.

[forest]
realms_number = 2

[realm.1]
ini = realm_1.ini    ; x in [-0.06, 0]

[realm.2]
ini = realm_2.ini    ; x in [0, 0.06]

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a  = 1
face_a   = +x        ; realm 1's +x face glued to realm 2's -x face
realm_b  = 2
face_b   = -x
coupling = mirror    ; same-resolution pass-through copy (the only implemented kind)
coupling_cadence = stage_coincident    ; beta: per-substage seam fill — REQUIRED for div-freeness (#31)

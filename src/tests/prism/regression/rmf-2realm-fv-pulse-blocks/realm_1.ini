; rmf-2realm-fv-pulse-blocks — REALM 1 (issue #51): rmf-2realm-fd-pulse/realm_1.ini on the FV path
; (fv_centered, 20 steps). check.sh builds the small-block variant (4 blocks per axis, ni 4, nj nk 8, the same
; cells) of one realm at a time, so the seam blocks of the two realms do not line up.

[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta] (leapfrog, blanes_moan, commutator_free_magnus: refused, moved to SELAH)
scheme_space             = fv_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fv ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename        = rmf_2realm_fv_pulse_blocks_r1
it_save                = 20
restart_basename       = rmf_2realm_fv_pulse_blocks_r1-restart
restart_save           = 500
residuals_save         = 1

[time]
time_max = -1E-5
it_max   = 20
CFL      = 0.5

[grid]
ni     = 8
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.0
emax_y = 0.06
emax_z = 0.06

[initial_conditions]
amr_iterations  = 0
type            = gaussian_pulse
k0              = 0.0
r0              = 0.0
pulse_direction = +y
sigma           = 0.01
B0              = 10.0

[amr]
max_level      = 1
ratio          = 8
iu_ref_levels  = 1
frequency      = 999999

; BC types: inflow / extrapolation / wall-inviscid / Silver_Muller / Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]


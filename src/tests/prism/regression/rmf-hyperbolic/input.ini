[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta] (leapfrog, blanes_moan, commutator_free_magnus: refused, moved to SELAH)
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = DB           ; [no,D,B,DB,BD]
divergence_correction    = hyperbolic   ; [no, hyperbolic] (hyperbolic needs constrained_transport D, B or DB)

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM
chi            = 1.0   ; GLM cleaning speed, in units of c
alpha          = 1.0E9 ; GLM damping rate of phi and psi [1/s]: alpha*t ~ 0.1 over the 10 steps

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename        = rmf_hyperbolic_regression
it_save                = 5
restart_basename       = HF_fnl-restart
restart_save           = 500
residuals_save         = 1
save_residual_fields   = .true.
save_divergence_fields = .true.

[time]
time_max = -1E-5
it_max   = 10
CFL      = 0.5

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.06
emax_y = 0.06
emax_z = 0.06

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
frequency      = 999999

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0 ;physical width of the layer (0 = inactive)
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
time_delay = 1.0E-19
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]


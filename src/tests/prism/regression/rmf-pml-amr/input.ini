; PRISM regression case (issue #95, P5.1): rmf-fwl with a CFS PML on the six faces instead of the fWLayer, and an init-time box marker
; (amr_iterations = 1) that refines the x-minus slab of blocks to level 3, so the block set changes after
; initialization. Anchors the rebuild of the per-block face data (layer ranges, PML support) on the final grid:
; before the fix they stayed on the pre-AMR blocks (48 of the 96 face blocks per rank). 5 steps.
[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0            ; number of ror iterations
ror_scheme_1        = 4            ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3            ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2            ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1            ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9          ; ror threshold triggering
ror_vars_number     = 2            ; number of variables to check
ror_ivar_1          = 1            ; index of variable 1
ror_ivar_2          = 7            ; index of variable 2
enable_ror_stats    = .false.      ; enable ror statistic saving
ib_reduction_extent = 0            ; extent of order reduction close to IB solids
ib_reduced_order    = 2            ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[IO]
output_basename    = rmf_pml_amr_regression
it_save            = 5
restart            = .false.
restart_basename   = rmf_pml_amr_restart
restart_save       = 500
residuals_save     = 1
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = -1E-5
it_max   = 5
CFL      = 0.499666666666666

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.24
emin_y = -0.24
emin_z = -0.24
emax_x = 0.24
emax_y = 0.24
emax_z = 0.24
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 1
type           = vacuum
regions_number = 0

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 1

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[amr_marker_1]
mode         = 1
geo_type     = primitive-box
delta_type   = max
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = -0.24
box_ymin     = -0.24
box_zmin     = -0.24
box_xmax     = -0.13
box_ymax     =  0.24
box_zmax     =  0.24
target_level = 3

[fWLayer]
width = 0.045 ;physical width of the layer; 64 leaf blocks (4^3) over [-0.24,0.24]
              ;=> block extent 0.12, ds = 0.12/16 = 0.0075, so 0.045 = 6 cells (the former C = 6)
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[PML]
PML_type      = CFS
width         = 0.045
x_minus_layer = .true.
x_plus_layer  = .true.
y_minus_layer = .true.
y_plus_layer  = .true.
z_minus_layer = .true.
z_plus_layer  = .true.
gamma_max     = 7.8E10
alfa_max      = 2.5E8
k_max         = 5.0

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0
helicon_coils_number = 0
time_delay = 1.0E-8
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.5E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.5E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.5E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.5E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

; VARIANT OF memory-scaling: identical in every respect EXCEPT that it carries
; rmf's four rectangular coils. Everything else -- grid, ngc, nv, it_max, AMR,
; BCs -- is bit-identical, so a diff of the two nb values isolates exactly one
; question: does coil memory enter the capacity budget?
;
; It does now: prism_common_object%compute_fields_number counts 3 block-sized
; fields per coil before nb is chosen (it did not while fields_number was a
; hardcoded 80, which let the coil arrays overrun the device on FNL). The coil
; arrays grow linearly in the coil count, each dimensioned on the per-rank nb:
;
;   J_vec        (3, ghosted-ijk, nb, nc)   adam_prism_coil_object.F90   [host]
;   j_vec_gpu    (nb, ghosted-ijk, 3, nc)   adam_prism_fnl_coil_object.F90 [device]
;
; At ni=nj=nk=16, ngc=3 each block-coil pair costs 3*22^3*8 = 255,552 bytes.
;
; coils.sh asserts the count (+3 fields per coil) and the resulting nb ratio.
;
; memory-scaling — minimal capacity probe for the nb / nodes_number algorithm.
;
; Measures how PRISM sizes the per-rank block capacity `nb` and the aggregate
; capacity `nb * procs_number` as ranks are added, and asserts the BACKEND-SPECIFIC
; expectation. Not a physics anchor: no golden, no field values compared. Everything
; measured happens at initialization, hence it_max = 1.
;
;   CPU  host RAM is SHARED; mpih_object.F90:136 divides it by procs_number.
;        Correct => nb HALVES, aggregate STAYS FLAT. Extra ranks on one node buy
;        no extra grid.
;   GPU  each rank owns its OWN device; adam_mpih_nvf_object.F90:63 does NOT divide.
;        Correct => nb CONSTANT, aggregate DOUBLES. Two GPUs buy twice the grid.
;
; The probe exists to catch a regression that CONFLATES the two memory models.
;
; Derived from rmf-amr-fd-pulse (a known-good input) rather than hand-written:
; PRISM has >100 keys that error_stop when absent, so a from-scratch minimal file
; is a trap. Only what the probe needs is changed -- see the deltas below.
; Deliberately EM with zero coils: the PIC particle arrays (sized from the WHOLE
; domain, replicated per rank, adam_prism_pic_object.F90:241) and the coil J_vec
; (multiplied by a GLOBAL coil count, adam_prism_coil_object.F90:141) are real
; scalability limits; coils are now counted in fields_number
; (prism_common_object%compute_fields_number), PIC particles are not.
; Excluding them isolates the nb/nodes_number algorithm itself.
;
; CAVEAT (recorded by scaling.sh, not asserted): the device budget is FREE memory,
; not total -- dev_init passes dev_memory_avail positionally into
; dev_get_device_memory_info(mem_free, mem_total) (fundal_dev_handling.F90:97), so
; it binds to ACC_PROPERTY_FREE_MEMORY. GPU `nb` therefore varies with whatever is
; already resident. Only the SCALING RATIO is asserted, never an absolute value.
;
; Deltas from rmf-amr-fd-pulse:
;   output_basename -> memory_scaling ; it_max 5 -> 1 ; markers_number 1 -> 0
;   amr_iterations 1 -> 0 ; all save frequencies -> 999999 (measurement is at init)


[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0
ror_scheme_1        = 4
ror_scheme_2        = 3
ror_scheme_3        = 2
ror_scheme_4        = 1
ror_threshold       = 0.9
ror_vars_number     = 2
ror_ivar_1          = 1
ror_ivar_2          = 7
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = multigrid ; [multigrid, gauss-seidel, sor, sor-omp]
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 0.0000000000000000000001

[IO]
output_basename        = memory_scaling_coils
it_save                = 999999
restart                = .false.
restart_basename       = HF_fnl-restart
restart_save           = 999999
residuals_save         = 999999
divergence_history_save = 999999
save_memory_status     = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = -1E-5
it_max   = 1
CFL      = 0.5

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.06
emax_y = 0.06
emax_z = 0.06
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations  = 0 ; capacity is decided at init; no AMR needed
type            = gaussian_pulse
regions_number  = 0
k0              = 0.0   ; pure gaussian envelope, no carrier
r0              = 0.0   ; packet centered at y=0 — overlaps the x=0 seam plane everywhere
pulse_direction = +y    ; TRANSVERSE to the seam normal (see header — load-bearing)
sigma           = 0.01
B0              = 10.0

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 1
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 0


; BC types: inflow / extrapolation / wall-inviscid / Silver_Muller / Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input — ZERO coils: the source-free property is this case's purpose.
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0
helicon_coils_number = 0
time_delay = 1.0E-19
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0

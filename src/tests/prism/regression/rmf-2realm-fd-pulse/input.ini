; PRISM forest manifest — INTER-REALM 1:1 mirror-seam variant of rmf-amr-fd-pulse.
;
; Issue #29 seam-type comparison. Same SOURCE-FREE gaussian-pulse physics as the
; single-realm rmf-amr-fd-pulse (J=0, nv=9, fd_centered order 6, +y pulse), but the
; ni=16 x-domain is split at x=0 into TWO SAME-RESOLUTION realms glued by a mirror
; (1:1) inter-realm seam. Union reconstructs the single-realm pulse domain bit-for-bit.
;
; Purpose: the INTER-REALM 1:1 div-free anchor (issue #31). The companion legs are the
; single-realm intra-block 1:1 (any uniform case) and the intra-realm 2:1 jump
; (rmf-amr-fd-pulse marker-active). With J=0 and NO resolution jump, both discrete
; divergences must sit at round-off — but only under the beta cadence set below (#31);
; alpha leaves the seam ghosts unfilled during RK substages and leaks div(B).
; The inter-realm mirror seam is a pure peer-interior COPY (fill_seam_from_peer_forest),
; exact like an intra-block ghost copy, so the mimetic div_h(curl_h)=0 identity holds
; across it. This ISOLATES the seam MECHANISM (inter-realm peer copy vs intra-block
; ghost copy) from the resolution JUMP: 1:1 of EITHER mechanism must be machine-zero;
; only the 2:1 jump (rmf-amr-fd-pulse marker-active leg) leaks.
;
; NOTE: an inter-realm 2:1 leg is NOT buildable — inter-realm coupling implements only
; COUPLING_MIRROR (same resolution); COUPLING_INTERPOLATE (mismatched grids) is reserved
; and unimplemented. The 2:1 jump exists only INTRA-realm (register_intra_realm_amr_seams).

[forest]
realms_number = 2

[realm.1]
ini = realm_1.ini    ; x in [-0.06, 0]

[realm.2]
ini = realm_2.ini    ; x in [0, 0.06]

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a  = 1
face_a   = +x        ; realm 1's +x face glued to realm 2's -x face
realm_b  = 2
face_b   = -x
coupling = mirror    ; same-resolution pass-through copy (the only implemented kind)
coupling_cadence = stage_coincident    ; beta: per-substage seam fill — REQUIRED for div-freeness (#31)

; rmf-2realm-fd-pulse-refined — forest manifest (issue #52): rmf-amr-fd-pulse split at its
; 2:1 face x = 0 into a fine realm (x < 0) and a coarse realm (x > 0) glued by a refined
; (2:1) inter-realm seam. The union is the cell set of the single-realm rmf-amr-fd-pulse,
; which it must reproduce bit for bit (check.sh), its #29 seam div(B) source included.
[forest]
realms_number = 2

[realm.1]
ini = realm_1.ini    ; fine,   x in [-0.06, 0]

[realm.2]
ini = realm_2.ini    ; coarse, x in [0, 0.06]

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +x
realm_b          = 2
face_b           = -x
coupling         = refined           ; 2:1 resolution jump (issue #52)
coupling_cadence = stage_coincident  ; beta: per-substage seam fill, as the 1:1 pulse (#31)

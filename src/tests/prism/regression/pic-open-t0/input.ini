[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta] (leapfrog, blanes_moan, commutator_free_magnus: refused, moved to SELAH)
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = plasma
plasma_domain = box
box_length_x = 0.01
box_length_y = 0.008
box_length_z = 0.006
box_x_center = 0.005
box_y_center = -0.004
box_z_center = 0.002
particle_weighting_model = TSC
current_weighting_model  = TSC ; non-conserving: the charge-conserving CPU deposit is single-block, single-rank
field_weighting_model = 2D
scheme_time = runge_kutta
plasma_density = 2E9
neutral_fraction = 0.1

[particle_injection]
random_seed = 12345
space_random_number_generator = random ;layered
space_pairing = no
electrons_velocity_distribution = maxwellian
ions_velocity_distribution = maxwellian
neutrals_velocity_distribution = pure_drift
ionic_temperature = 300
electronic_temperature = 30000
velocity_random_number_generator = random ;layered
velocity_pairing = no
electrons_drift_x  = 0.0
electrons_drift_y  = 0.0
electrons_drift_z  = 0.0
ions_drift_x  = 0.0
ions_drift_y  = 0.0
ions_drift_z  = 0.0
neutrals_drift_x  = 0.0
neutrals_drift_y  = 0.0
neutrals_drift_z  = 0.0
v_av_correction = yes

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = pic_open_t0
it_save            = 2
restart_basename   = pic_open_t0-restart
restart_save       = 100
residuals_save     = 1
save_residual_fields   = .true.
save_divergence_fields = .true.

[time]
time_max = 2.5E-6
it_max   = 4
CFL      = 0.5

[grid]
ni     = 8 ; 64 blocks of 8^3 (32^3 cells): the blocks spread over the ranks
nj     = 8
nk     = 8
ngc    = 3
emin_x = -0.02
emin_y = -0.02
emin_z = -0.02
emax_x = 0.02
emax_y = 0.02
emax_z = 0.02

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
frequency      = 50000

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
; Dirichlet
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]


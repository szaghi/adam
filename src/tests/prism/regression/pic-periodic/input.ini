; PIC regression pic-periodic: uniform plasma of the
; Fresnel pilot, periodic on every face, plane wave of one box length, 2 macroparticles per cell per species.
; input.ini: one block (CPU and FNL np 1); input-np2.ini: the same grid as 64 blocks (FNL np 2).
[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = plasma
plasma_domain = uniform
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
elliptic_initialization_closure = grounded
filter_deposition = .false.
particle_weighting_model = TSC
current_weighting_model  = conserving
current_conserving_solver = esirkepov_Q10
esirkepov_tail_cleanup = .false.
field_weighting_model = esirkepov_Q10 ; coherent gather of the deposit
scheme_time = runge_kutta
plasma_density = 5.663678e+31
neutral_fraction = 0.0
particle_weight = 3.456834717 ; 2 macroparticles per cell per species

[particle_injection]
random_seed = 12345
space_random_number_generator = random ;layered
space_pairing = no
electrons_velocity_distribution = maxwellian
ions_velocity_distribution = maxwellian
neutrals_velocity_distribution = pure_drift
ionic_temperature = 300
electronic_temperature = 30000
velocity_random_number_generator = random ;layered
velocity_pairing = no
electrons_drift_x  = 0.0
electrons_drift_y  = 0.0
electrons_drift_z  = 0.0
ions_drift_x  = 0.0
ions_drift_y  = 0.0
ions_drift_z  = 0.0
neutrals_drift_x  = 0.0
neutrals_drift_y  = 0.0
neutrals_drift_z  = 0.0
v_av_correction = yes

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0            ; number of ror iterations
ror_scheme_1        = 4            ; scheme for 1 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_2        = 3            ; scheme for 2 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_3        = 2            ; scheme for 3 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_scheme_4        = 1            ; scheme for 4 iteration (6=weno-11 / 5=weno-9 / 4=weno-7 / 3=weno-5 / 2=weno-3 / 1=weno-1)
ror_threshold       = 0.9          ; ror threshold triggering
ror_vars_number     = 2            ; number of variables to check
ror_ivar_1          = 1            ; index of variable 1
ror_ivar_2          = 7            ; index of variable 2
enable_ror_stats    = .false.      ; enable ror statistic saving
ib_reduction_extent = 0            ; extent of order reduction close to IB solids
ib_reduced_order    = 2            ; reduced order close to IB solids (weno-7/weno-5/weno-3/weno-1)

[IO]
output_basename    = pic_periodic
it_save            = 40
restart            = .false.
restart_basename   = pic_periodic-restart
restart_save       = 40
residuals_save     = 40
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = 1.0E-15
it_max   = 40
CFL      = 0.5

[grid]
ni     = 32
nj     = 24
nk     = 24
ngc    = 6
emin_x = 0.0
emin_y = -7.5e-10
emin_z = -7.5e-10
emax_x = 2e-09
emax_y = 7.5e-10
emax_z = 7.5e-10
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations  = 0
type            = plane_wave
kx = 1.0
ky = 0.0
kz = 0.0
lambda = 2e-09 ; one wavelength = the box, k c/w_pe = 3.14159
B0 = 5.627636e+04 ; a0 = e B0/(m_e w) = 0.01, w = 3.29691 w_pe

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
; Dirichlet
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

[PML]
PML_type = none

[probes]
probes_number = 0

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0
[slice_1]
itype  = trilinear
n_save = 100
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001
[slice_2]
itype  = trilinear
n_save = 100
ni     = 320
nj     = 320
nk     = 1
emin_x = 0.1
emin_y = 0.1
emin_z = 10.0001
emax_x = 19.9
emax_y = 19.9
emax_z = 10.0001

; rmf-amr — single-realm PRISM case with a STATIC intra-realm 2:1 AMR jump.
;
; Issue #13 §7.5 milestone M1: drive the live IC-time AMR refine path
; (`[initial_conditions] amr_iterations` -> prism_cpu_object%amr_update) from a
; deterministic AMR_GEO primitive-box marker, under scheme_space=fv_centered (the
; reflux-relevant scheme), so a coarse-fine seam forms at known coordinates. The
; box covers the x<0 half of the domain, so blocks with centroid x<0 refine one
; level while x>0 blocks stay coarse — a 2:1 jump across x=0.
;
; M1 acceptance is STRUCTURAL (blocks_number>1, NODE_MORE/LESS_REFINED set on the
; seam faces, ghost-fill runs), NOT a golden digest — this case de-risks the refine
; path before the M2 registration pass / M3 reflux depend on it. No golden is
; committed yet (the run.sh harness skips goldenless cases by default).

[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fv_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fv ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-1
ror_number          = 0
ror_scheme_1        = 4
ror_scheme_2        = 3
ror_scheme_3        = 2
ror_scheme_4        = 1
ror_threshold       = 0.9
ror_vars_number     = 2
ror_ivar_1          = 1
ror_ivar_2          = 7
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = multigrid ; [multigrid, gauss-seidel, sor, sor-omp]
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 0.0000000000000000000001

[IO]
output_basename        = rmf_amr_regression
it_save                = 5
restart                = .false.
restart_basename       = HF_fnl-restart
restart_save           = 500
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[time]
time_max = -1E-5
it_max   = 5
CFL      = 0.5

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.06
emax_y = 0.06
emax_z = 0.06
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 1 ; >=1 so the IC-time amr_update fires the box marker once
type           = vacuum
regions_number = 0

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 1
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 1

[amr_marker_1]
mode         = 1            ; AMR_GEO (geometric marker)
geo_type     = primitive-box
delta_type   = max          ; unused by the box marker; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = -0.06        ; refine the x<0 half of the domain
box_ymin     = -0.06
box_zmin     = -0.06
box_xmax     =  0.0
box_ymax     =  0.06
box_zmax     =  0.06
target_level = 2            ; refine in-box blocks up to (below) level 2

; BC types: inflow / extrapolation / wall-inviscid / Silver_Muller / Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
C = 0
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0
helicon_coils_number = 0
time_delay = 1.0E-19
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 2
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.497916666666667E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0

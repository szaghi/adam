; PRISM forest manifest — two-realm x-split rmf regression case.
;
; Phase D.4 of issue #10 / D.4 of issue #13. Splits the single-realm rmf
; case along x=0 into two adjacent realms whose union reconstructs the
; original domain bit-for-bit. The regression compares the aggregated
; per-realm digests against the single-realm rmf golden.

[forest]
realms_number = 2

[realm.1]
ini = realm_1.ini    ; x ∈ [-0.06, 0]

[realm.2]
ini = realm_2.ini    ; x ∈ [0,  0.06]

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a  = 1
face_a   = +x        ; realm 1's +x face is glued to realm 2's -x face
realm_b  = 2
face_b   = -x
coupling = mirror    ; pass-through copy; the only kind v1 implements

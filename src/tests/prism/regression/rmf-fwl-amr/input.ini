; PRISM regression case (issue #95, P5.1): rmf-fwl with the six fWLayer faces, and an init-time box marker
; (amr_iterations = 1) that refines the x-minus slab of blocks to level 3, so the block set changes after
; initialization. Anchors the rebuild of the per-block face data (layer ranges, PML support) on the final grid:
; before the fix they stayed on the pre-AMR blocks (48 of the 96 face blocks per rank). 5 steps.
[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = rmf_fwl_amr_regression
it_save            = 5
restart_basename   = rmf_fwl_amr_restart
restart_save       = 500
residuals_save     = 1
save_residual_fields   = .true.
save_divergence_fields = .true.

[time]
time_max = -1E-5
it_max   = 5
CFL      = 0.499666666666666

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.24
emin_y = -0.24
emin_z = -0.24
emax_x = 0.24
emax_y = 0.24
emax_z = 0.24

[initial_conditions]
amr_iterations = 1
type           = vacuum

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 2
frequency      = 999999

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[amr_marker_1]
mode         = 1
geo_type     = primitive-box
delta_type   = max
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = -0.24
box_ymin     = -0.24
box_zmin     = -0.24
box_xmax     = -0.13
box_ymax     =  0.24
box_zmax     =  0.24
target_level = 3

[fWLayer]
width = 0.045 ;physical width of the layer; 64 leaf blocks (4^3) over [-0.24,0.24]
              ;=> block extent 0.12, ds = 0.12/16 = 0.0075, so 0.045 = 6 cells (the former C = 6)
x_minus_layer = yes
x_plus_layer  = yes
y_minus_layer = yes
y_plus_layer  = yes
z_minus_layer = yes
z_plus_layer  = yes

; Coils input
[coils_input]
time_delay = 1.0E-8
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.000
y_center = 0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.5E8
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.000
y_center = -0.0305
z_center = 0.000
normal = +y
Amplitude = 100
Frequency = 2.5E8
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.5E8
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = -0.0305
y_center = 0.000
z_center = 0.000
normal = +x
Amplitude = 100
Frequency = 2.5E8
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]


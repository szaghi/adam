[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = PIC

[PIC]
problem_type = plasma
problem_type = plasma
plasma_domain = cilinder
cilinder_radius = 0.005
cilinder_length = 0.01
cilinder_x_center = 0.0
cilinder_y_center = 0.0
cilinder_z_center = 0.0
cilinder_axis = z
electric_field_elliptic_initialization = .true.
magnetic_field_elliptic_initialization = .true.
particle_weighting_model = Gaussian
current_weighting_model  = Gaussian
field_weighting_model = Gaussian
sigma = 0.002
cutoff_sigma = 3.0
scheme_time = runge_kutta
plasma_density = 2E9
neutral_fraction = 0.1

[particle_injection]
space_random_number_generator = random ;layered
space_pairing = no
electrons_velocity_distribution = maxwellian
ions_velocity_distribution = maxwellian
neutrals_velocity_distribution = pure_drift
ionic_temperature = 300
electronic_temperature = 30000
velocity_random_number_generator = random ;layered
velocity_pairing = no
electrons_drift_x  = 0.0
electrons_drift_y  = 0.0
electrons_drift_z  = 0.0
ions_drift_x  = 0.0
ions_drift_y  = 0.0
ions_drift_z  = 0.0
neutrals_drift_x  = 0.0
neutrals_drift_y  = 0.0
neutrals_drift_z  = 0.0
v_av_correction = yes

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = fd_centered_6
it_save            = 500
restart            = .false.
restart_basename   = fd_centered_6-restart
restart_save       = 100
residuals_save     = 1
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = 2.5E-6
it_max   = 1
CFL      = 0.5

[grid]
ni     = 50
nj     = 50
nk     = 50
ngc    = 6
emin_x = -0.02
emin_y = -0.02
emin_z = -0.02
emax_x = 0.02
emax_y = 0.02
emax_z = 0.02
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = uniform_field
B_x            = 0.0
B_y            = 0.0
B_z            = 0.0

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
; Dirichlet
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0 ;cell width of the layer
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

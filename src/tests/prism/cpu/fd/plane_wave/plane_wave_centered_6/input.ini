[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv); fd = this input as written (issue #58)
fdv_order  = 6  ; [2,4,6,8,10]; moved from [numerics], where the parser no longer reads it (issue #58)

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = fd_centered-6
it_save            = 50
restart            = .false.
restart_basename   = fd_centered-6-restart
restart_save       = 100
residuals_save     = 10
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = -1.5E-8
it_max   = 1000
CFL      = 0.5

[grid]
ni     = 200
nj     = 60
nk     = 60
ngc    = 3
emin_x = -0.1
emin_y = -0.03
emin_z = -0.03
emax_x = 0.1
emax_y = 0.03
emax_z = 0.03
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = plane_wave
kx             = 1.0
ky             = 0.0
kz             = 0.0
lambda         = 0.05
B0             = 10.0

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[fWLayer]
width = 0.0 ; physical layer width (0 = inactive); was the removed cell count C = 0 (issue #58)
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0 ; required since 8462f6b1 (helicon coils); 0 = this input as written (issue #58)
helicon_coils_number  = 0 ; required since 8462f6b1; 0 = this input as written (issue #58)

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0

[slices]
slices_number = 0

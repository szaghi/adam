[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename        = prova_AMR
it_save                = 3250
restart                = .false.
restart_basename       = prova_AMR-restart
restart_save           = 1000
residuals_save         = 300
save_memory_status     = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = -1E-5
it_max   = 5 ;58500
CFL      = 0.491967145304839

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = -0.08
emin_y = -0.08
emin_z = -0.08
emax_x = 0.08
emax_y = 0.08
emax_z = 0.08
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 2 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 6 
ratio          = 8
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 5
markers_number = 1

[amr_marker_1]
mode         = 3 ; total variation
delta_type   = max
delta_fine   = 0.00125
delta_coarse = 0.005
field        = 1 ; 1=q, 2=q_aux
var          = 1
tol          = 1000.0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0 ; physical layer width (0 = inactive); was the removed cell count C = 0 (issue #58)
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 4
solenoid_coils_number = 0 ; required since 8462f6b1 (helicon coils); 0 = this input as written (issue #58)
helicon_coils_number  = 0 ; required since 8462f6b1; 0 = this input as written (issue #58)
time_delay = 1.0E-18
[coils_input_coil_1]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.0025
y_center = 0.0325
z_center = 0.0025
normal = +y
Amplitude = 100
Frequency = 2.5E7
Phase = 0.0
[coils_input_coil_2]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.0025
y_center = -0.0325
z_center = 0.0025
normal = +y
Amplitude = 100
Frequency = 2.5E7
Phase = 0.0
[coils_input_coil_3]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = 0.0325
y_center = 0.0025
z_center = 0.0025
normal = +x
Amplitude = 100
Frequency = 2.5E7
Phase = -90.0
[coils_input_coil_4]
coil_type = rectangular
current_type = AC_current
lx = 0.04
ly = 0.05
sigma = 0.002
x_center = -0.0325
y_center = 0.0025
z_center = 0.0025
normal = +x
Amplitude = 100
Frequency = 2.5E7
Phase = -90.0

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0

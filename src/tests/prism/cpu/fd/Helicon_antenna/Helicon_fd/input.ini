[numerics]
reconstruction_variables = conservative ; [conservative, characteristichs]
scheme_time              = runge_kutta  ; [runge_kutta, leapfrog, adams_bashforth]
scheme_space             = fd_centered  ; [weno, fd_centered, fv_centered]
constrained_transport    = no           ; [no,D,B,DB,BD]
divergence_correction    = no           ; [no, hyperbolic, poisson]

[fdv]
fdv_scheme = fd ; finite difference (fd), finite volume (fv)
fdv_order  = 6  ; [2,4,6,8,10] order of finite difference/volume schemes

[physics]
physical_model = EM

[runge_kutta]
scheme = runge-kutta-ssp-54

[IO]
output_basename    = Helicon_fd
it_save            = 6000
restart            = .false.
restart_basename   = Helicon_fd-restart
restart_save       = 500
residuals_save     = 100
save_memory_status = .false.
save_residual_fields   = .true.
save_curl_fields       = .false.
save_divergence_fields = .true.

[time]
time_max = 1E-5
it_max   = 60000
CFL      = 0.499650011111111

[grid]
ni     = 120
nj     = 120
nk     = 120
ngc    = 3
emin_x = -0.06
emin_y = -0.06
emin_z = -0.06
emax_x = 0.06
emax_y = 0.06
emax_z = 0.06
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = vacuum

[amr]
max_level      = 0
ratio          = 8
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0

; BC types:
; inflow
; extrapolation
; wall-inviscid
; Silver_Muller
; Periodic
[bc_x_min]
type = Neumann
[bc_x_max]
type = Neumann
[bc_y_min]
type = Neumann
[bc_y_max]
type = Neumann
[bc_z_min]
type = Neumann
[bc_z_max]
type = Neumann

[fWLayer]
width = 0.0 ; physical layer width (0 = inactive); was the removed cell count C = 0 (issue #58)
x_minus_layer = no
x_plus_layer  = no
y_minus_layer = no
y_plus_layer  = no
z_minus_layer = no
z_plus_layer  = no

; Coils input
[coils_input]
circular_coils_number = 0
rectangular_coils_number = 0
solenoid_coils_number = 0
helicon_coils_number = 1
time_delay = 1.0E-18
[coils_input_coil_1]
coil_type = helicon
current_type = AC_current
sigma = 0.002
x_center = 0.000
y_center = 0.000
z_center = 0.000
normal = +z
r_coil = 0.010
Amplitude = 100
Frequency = 2.5E7
Phase = 0.0
N_points = 13
x_point_1  =  0.000
y_point_1  =  0.010
z_point_1  =  0.025
x_point_2  =  0.000
y_point_2  =  0.010
z_point_2  = -0.025
x_point_3  = -0.010
y_point_3  =  0.000
z_point_3  = -0.025
x_point_4  =  0.000
y_point_4  = -0.010
z_point_4  = -0.025
x_point_5  =  0.000
y_point_5  = -0.010
z_point_5  =  0.025
x_point_6  = -0.010
y_point_6  =  0.000
z_point_6  =  0.025
x_point_7  =  0.000
y_point_7  =  0.010
z_point_7  =  0.025
x_point_8  =  0.000
y_point_8  =  0.010
z_point_8  = -0.025
x_point_9  =  0.010
y_point_9  =  0.000
z_point_9  = -0.025
x_point_10 =  0.000
y_point_10 = -0.010
z_point_10 = -0.025
x_point_11 =  0.000
y_point_11 = -0.010
z_point_11 =  0.025
x_point_12 =  0.010
y_point_12 =  0.000
z_point_12 =  0.025
x_point_13 =  0.000
y_point_13 =  0.010
z_point_13 =  0.025

[external_fields]
external_fields_applied = none ; [RMF, MAGNETIC_NOZZLE, RMF_AND_MAGNETIC_NOZZLE, NONE]

[solids]
number    = 0
n_eikonal = 2

[slices]
slices_number = 0

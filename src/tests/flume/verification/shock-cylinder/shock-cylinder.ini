; FLUME verification (issue #35, P6 exit / V6): Mach 2 planar shock over a cylinder, immersed boundary, init-time AMR.
; 2-D in x-y (z null; octree, because the library reflux 2:1 restriction needs two tangential axes). 64 blocks of
; 16x16x4 cells, the blocks crossed by the cylinder surface refined once more (solid marker). Pre-shock rho 1.4, p 1
; (sound speed 1); post-shock rho 3.7333, u 1.25, p 4.5 left of x = 0.2 and at the inflow; inviscid walls in y.
; Cylinder radius 0.13 centred at (0.5, 0.5), Euler wall: its surface crosses the block faces x = 0.375 and 0.625 at a
; shallow angle, so fluid and solid cells face each other across block faces (the phi summary in the ghost cells).
; SSP-33, CFL 0.5, t = 0.25 (the shock has passed the cylinder).
[IO]
output_basename        = shock-cylinder
it_save                = 100000
restart                = .false.
restart_basename       = shock-cylinder-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 16
nj     = 16
nk     = 4
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 1

[amr_marker_1]
mode         = 1           ; AMR_GEO (geometric marker)
geo_type     = solid       ; blocks crossed by the surface of solid 1
solid        = 1
delta_type   = max
delta_fine   = 0.0078125   ; one level below the base spacing 0.015625
delta_coarse = 0.015625

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 1
n_eikonal = 2

[solid_1]
name            = cylinder
bc_type         = 2                 ; 1 viscous wall, 2 Euler wall
definition      = analytical_circle
circle_center_x = 0.5
circle_center_y = 0.5
circle_center_z = 0.5
circle_radius   = 0.13
circle_axis     = z

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = inflow
r    = 3.7333333333333334
u    = 1.25
v    = 0.0
w    = 0.0
p    = 4.5
[bc_x_max]
type = extrapolation
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = riemann-problem
regions_number = 2
amr_iterations = 1

[initial_conditions_region_1]
r      = 3.7333333333333334
u      = 1.25
v      = 0.0
w      = 0.0
p      = 4.5
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.2
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
r      = 1.4
u      = 0.0
v      = 0.0
w      = 0.0
p      = 1.0
emin_x = 0.2
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.25
CFL      = 0.5

[diagnostics]
conservation_history_save = 1

; FLUME MHD plumbing check (issue #41, M2-P1): ideal MHD with GLM cleaning (nv = 9, psi = 0), a seeded uniform state
; on 64 blocks of 8^3 cells (two uniform levels, so both ranks own blocks and the restart leg is meaningful).
; The time step must follow the fast magnetosonic speed, the auxiliary fields the conservative ones, and a
; restart must reproduce the continuous run bitwise.
[IO]
output_basename        = mhd-uniform
it_save                = 10
restart                = .false.
restart_basename       = mhd-uniform-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .true.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 8
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 0

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = mhd-ideal
cp             = 2.5
cv             = 1.5

[mhd]
divergence_control = glm
glm_ch             = 3.0
glm_alpha          = 0.18
glm_damping_length = 1.0
glm_ch_check       = warning
divb_tol           = 0.0
divb_error         = .false.
rho_floor          = 0.0
p_floor            = 0.0

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = inflow
r    = 1.0
u    = 0.3
v    = -0.2
w    = 0.1
p    = 1.0
bx   = 0.8
by   = 0.5
bz   = -0.3
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = uniform
amr_iterations = 0
s              = 0.05 ; relative amplitude of the seeded density/pressure perturbation

[initial_conditions_region_1]
r  = 1.0
u  = 0.3
v  = -0.2
w  = 0.1
p  = 1.0
bx = 0.8
by = 0.5
bz = -0.3

[time]
it_max   = 10
time_max = 1000.0
CFL      = 0.8

[diagnostics]
conservation_history_save = 1

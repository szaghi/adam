; FLUME forest manifest (issue #40): the sod-z Sod shock tube split in two realms at z = 0.5, the sod-2realm split along
; z. On two or more ranks each realm's blocks are split by z, so the seam blocks of realm 1 (top) and of realm 2
; (bottom) land on different ranks: the seam ghosts and the reflux register cross ranks, and the union reproduces sod-z
; bitwise on 1 to 4 ranks (multirealm/check.sh leg 3).

[forest]
realms_number = 2

[realm.1]
ini = sod-2realm-z-r1.ini

[realm.2]
ini = sod-2realm-z-r2.ini

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +z
realm_b          = 2
face_b           = -z
coupling         = mirror
coupling_cadence = stage_coincident

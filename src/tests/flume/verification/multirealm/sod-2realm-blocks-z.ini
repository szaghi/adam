; FLUME issue #51: sod-2realm-z.ini with misaligned seam blocks, the larger ones in realm 1 (the register side): each register
; face holds 2x2 realm-2 faces, and on N ranks the seam crosses ranks. Must reproduce sod-z bit for bit.

[forest]
realms_number = 2

[realm.1]
ini = sod-2realm-blocks-z-r1.ini

[realm.2]
ini = sod-2realm-blocks-z-r2.ini

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +z
realm_b          = 2
face_b           = -z
coupling         = mirror
coupling_cadence = stage_coincident

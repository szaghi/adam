; FLUME skeleton check (issue #35, P1): a uniform state on 8 blocks, 5 SSP-33 steps.
; With the P1 null residual the state must stay exactly constant; the run exercises the whole
; initialization / step / output pipeline of the backend.
[IO]
output_basename        = uniform
it_save                = 5
restart                = .false.
restart_basename       = uniform-restart
restart_save           = 0
residuals_save         = 1
save_residual_fields   = .false.
save_auxiliary_fields  = .false.

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level      = 1
ratio          = 8
iu_ref_levels  = 1
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5

[solids]
number    = 0

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = inflow
r    = 1.2
u    = 10.0
v    = 0.0
w    = 0.0
p    = 101325.0
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = uniform
amr_iterations = 0
s              = 0.0 ; relative amplitude of the seeded density/pressure perturbation

[initial_conditions_region_1]
r = 1.2
u = 10.0
v = 0.0
w = 0.0
p = 101325.0

[time]
it_max   = 5
time_max = 1.0
CFL      = 0.8

[diagnostics]
conservation_history_save = 1

; FLUME regression case (issue #74, M5-P5): runtime regridding. The isentropic vortex of vortex-periodic on a periodic
; quadtree, base level 1, max_level 3, 8x8 cells per block, a Loehner marker on the density, a regrid every 5 steps with
; the conservative prolongation, reflux on: verification/regrid/make_regrid.py vortex --it-max 100 (RG leg rg3 runs it
; to 200 steps). Six regrids that refine and coarsen, so the digest covers the marking, the transfers, the
; redistribution and the flux register rebuilt at each regrid. Changing it invalidates golden/.
[IO]
output_basename        = vortex-regrid
it_save                = 100000
restart                = .false.
restart_basename       = vortex-regrid-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 3
ratio          = 4
iu_ref_levels  = 1
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 5
regrid_prolongation = conservative
iters          = 2
markers_number = 1

[amr_marker_1]
mode         = 4             ; Loehner estimator (issue #74)
delta_type   = max           ; unused by the Loehner marker; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
field        = 1             ; 1 conservative, 2 auxiliary variables
var          = 1
refine_tol   = 0.3
derefine_tol = 0.1
floor        = 0.0
buffer       = 2

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = isentropic-vortex
amr_iterations = 0
x0             = 0.5
y0             = 0.5
radius         = 0.07
strength       = 5.0

[initial_conditions_region_1]
r = 1.0
u = 1.0
v = 1.0
w = 0.0
p = 1.0

[time]
it_max   = 100
time_max = 10.0
CFL      = 0.4

[diagnostics]
conservation_history_save = 1

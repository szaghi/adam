; FLUME regression sinks-shu (issue #94, P4): the overdense singular isothermal sphere (A = 29.3, gamma = 1.001) with a
; seed sink at the centre (verification/sinks make_si.py --case shu --cells 16 --it-max 30), 16^3, isolated self-gravity,
; closed walls, 30 steps. Covers the sinks' deposit into the Poisson source, the CIC gather, threshold accretion, the
; kick-drift-kick, the sink time-step limits and the sink columns of the conservation history.
[IO]
output_basename = sinks-shu
it_save = 1000000
restart = .false.
restart_basename = sinks-shu-restart
restart_save = 0
residuals_save = 1
save_memory_status = .false.
save_residual_fields = .false.
save_auxiliary_fields = .false.
save_curl_fields = .false.
save_divergence_fields = .false.
save_gradient_fields = .false.
save_laplacian_fields = .false.
[grid]
ni = 8
nj = 8
nk = 8
ngc = 4
emin_x = -1.0
emin_y = -1.0
emin_z = -1.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.
[amr]
max_level = 1
ratio = 8
iu_ref_levels = 1
i_prune = 0
j_prune = 0
k_prune = 0
l_prune = -1
frequency = 0
iters = 1
markers_number = 0
[field]
nv = 5
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
ror_number = 0
ror_threshold = 0.9
ror_vars_number = 0
enable_ror_stats = .false.
ib_reduction_extent = 0
ib_reduced_order = 2
[linear-algebra]
smoothing = gauss-seidel
iterations_init = 3
iterations_coarse = 10
iterations_fine = 3
iterations = 10
tolerance = 1.e-20
[fdv]
fdv_scheme = fd
fdv_order = 2
[solids]
number = 0
n_eikonal = 0
[slices]
slices_number = 0
[physics]
physical_model = euler
gamma = 1.001
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
positivity_limiter = cell
[bc_x_min]
type = wall-inviscid
[bc_x_max]
type = wall-inviscid
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = wall-inviscid
[bc_z_max]
type = wall-inviscid
[time]
it_max = 30
time_max = 0.25
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 1.0
poisson_bc = isolated
[initial_conditions]
type = singular-isothermal-sphere
regions_number = 1
amr_iterations = 0
sis_overdensity = 29.3

[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.25

[sinks]
x = 0.0
y = 0.0
z = 0.0
u = 0.0
v = 0.0
w = 0.0
mass = 1.0e-6
creation = .false.

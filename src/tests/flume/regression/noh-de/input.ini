; FLUME regression noh-de (issue #91, P4): the cold planar Noh shock of verification/dualenergy de2 with
; physical_model = euler-de, the dual-energy floor at its default switch (make_de.py noh --model euler-de): two
; streams rho = 1, u = +-1, p = 1e-6 (Mach 845, gamma 1.4) colliding at x = 0.5, 50 cells, WENO5 characteristic,
; SSP-33, CFL 0.5, t = 0.6. Every cell starts cold: the floor acts every step, so a change to the model shows here.
[IO]
output_basename        = noh-de
it_save                = 100000
restart_basename       = noh-de-restart
restart_save           = 0
residuals_save         = 1
save_auxiliary_fields  = .false.

[grid]
ni     = 50
nj     = 4
nk     = 4
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_y = .true.
null_z = .true.

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5

[physics]
physical_model = euler-de
gamma = 1.4

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = riemann-problem
amr_iterations = 0

[initial_conditions_region_1]
r      = 1.0
u      = 1.0
v      = 0.0
w      = 0.0
p      = 1.0e-6
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
r      = 1.0
u      = -1.0
v      = 0.0
w      = 0.0
p      = 1.0e-6
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.6
CFL      = 0.5

[diagnostics]
conservation_history_save = 1

; FLUME regression case (issue #51): frozen copy of verification/multirealm/sod-2realm-blocks.ini (forest manifest).
; Changing it or its realm INIs invalidates golden/.
; FLUME issue #51: sod-2realm.ini with the seam blocks of the two realms not lined up (same cells): each realm-2 seam block faces
; 2x2 realm-1 seam blocks. The union must reproduce sod-x bit for bit (check.sh leg 5).

[forest]
realms_number = 2

[realm.1]
ini = sod-2realm-blocks-r1.ini

[realm.2]
ini = sod-2realm-blocks-r2.ini

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +x
realm_b          = 2
face_b           = -x
coupling         = mirror
coupling_cadence = stage_coincident

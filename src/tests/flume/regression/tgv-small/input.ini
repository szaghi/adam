; FLUME regression case (issue #119, T0.2): the compressible Taylor-Green vortex, Re 1600, M 0.4, 16^3 cells on 8 blocks, 20 steps, with
; the turbulence history on (verification/turbulence/make_tgv.py --n 16 --levels 1 --mach 0.4 --it-max 20 --it-save 20).
[IO]
output_basename = tgv
it_save = 20
restart_basename       = vortex-n064-restart
restart_save           = 0
residuals_save         = 1
save_auxiliary_fields  = .false.

[grid]
ni = 8
nj = 8
nk = 8
ngc = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 6.2831853071795862e+00
emax_y = 6.2831853071795862e+00
emax_z = 6.2831853071795862e+00

[amr]
max_level = 1
ratio = 8
iu_ref_levels = 1

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
weights = si
scheme = weno-u-5

[physics]
prandtl = 0.71
reynolds = 1600.0
physical_model = euler
cp = 3.5
cv = 2.5

[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[initial_conditions]
tg_mach = 0.4
tg_velocity = 1.0
tg_density = 1.0
type = taylor-green
amr_iterations = 0

[time]
it_max = 20
time_max = 20.0
CFL = 0.5

[diagnostics]
turbulence_history_save = 1
conservation_history_save = 1

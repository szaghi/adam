; FLUME regression case (issue #81, P6): self-gravity with isolated boundaries (zero-padded FFT, lattice Green's
; function). Changing it invalidates golden/. make_polytrope.py star --levels 1 (SV-7): the n = 1 polytrope in
; equilibrium in a closed box, 16^3 cells (2^3 blocks of 8^3), 20 steps. Runs on the FFT executable.
[IO]
output_basename = star
it_save = 1000000
restart_basename = star-restart
restart_save = 0
residuals_save = 1
save_auxiliary_fields = .false.
[grid]
ni = 8
nj = 8
nk = 8
ngc = 4
emin_x = -1.0
emin_y = -1.0
emin_z = -1.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
[amr]
max_level = 1
ratio = 8
iu_ref_levels = 1
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
[physics]
physical_model = euler
gamma = 2.0
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
[bc_x_min]
type = wall-inviscid
[bc_x_max]
type = wall-inviscid
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = wall-inviscid
[bc_z_max]
type = wall-inviscid
[time]
it_max = 20
time_max = 100.0
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 1.0
poisson_bc = isolated
[initial_conditions]
type = polytrope
amr_iterations = 0
star_radius = 0.5
star_density = 1.0
star_pressure_factor = 1.0
[initial_conditions_region_1]
r = 0.01
u = 0.0
v = 0.0
w = 0.0
p = 0.0015915494309189536

; FLUME regression case (issue #81, P6): self-gravity with isolated boundaries (zero-padded FFT, lattice Green's
; function). Changing it invalidates golden/. make_polytrope.py star --levels 1 (SV-7): the n = 1 polytrope in
; equilibrium in a closed box, 16^3 cells (2^3 blocks of 8^3), 20 steps. Runs on the FFT executable.
[IO]
output_basename = star
it_save = 1000000
restart = .false.
restart_basename = star-restart
restart_save = 0
residuals_save = 1
save_memory_status = .false.
save_residual_fields = .false.
save_auxiliary_fields = .false.
save_curl_fields = .false.
save_divergence_fields = .false.
save_gradient_fields = .false.
save_laplacian_fields = .false.
[grid]
ni = 8
nj = 8
nk = 8
ngc = 4
emin_x = -1.0
emin_y = -1.0
emin_z = -1.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.
[amr]
max_level = 1
ratio = 8
iu_ref_levels = 1
i_prune = 0
j_prune = 0
k_prune = 0
l_prune = -1
frequency = 0
iters = 1
markers_number = 0
[field]
nv = 5
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
ror_number = 0
ror_threshold = 0.9
ror_vars_number = 0
enable_ror_stats = .false.
ib_reduction_extent = 0
ib_reduced_order = 2
[fdv]
fdv_scheme = fd
fdv_order = 2
[solids]
number = 0
n_eikonal = 0
[slices]
slices_number = 0
[physics]
physical_model = euler
gamma = 2.0
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
positivity_limiter = none
[bc_x_min]
type = wall-inviscid
[bc_x_max]
type = wall-inviscid
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = wall-inviscid
[bc_z_max]
type = wall-inviscid
[time]
it_max = 20
time_max = 100.0
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 1.0
poisson_bc = isolated
[initial_conditions]
type = polytrope
amr_iterations = 0
star_radius = 0.5
star_density = 1.0
star_pressure_factor = 1.0
[initial_conditions_region_1]
r = 0.01
u = 0.0
v = 0.0
w = 0.0
p = 0.0015915494309189536

; FLUME regression case (issue #37): frozen copy of verification/multirealm/sod-2realm.ini (forest manifest).
; Changing it or its realm INIs invalidates golden/.
; FLUME forest manifest (issue #37): the sod-x Sod shock tube split in two realms at x = 0.5, the diaphragm itself, so the
; inter-realm seam carries the Riemann problem from the first step. Realm 1 is x in [0, 0.5], realm 2 x in [0.5, 1], both
; with the cell size of the single-realm sod-x: their union is the sod-x cell set. Mirror coupling with beta
; (stage-coincident) cadence fills the seam ghosts at every Runge-Kutta stage; both realms use SSP-33 (beta
; admissibility). check.sh requires the union to reproduce the single-realm sod-x bit for bit.

[forest]
realms_number = 2

[realm.1]
ini = sod-2realm-r1.ini

[realm.2]
ini = sod-2realm-r2.ini

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +x
realm_b          = 2
face_b           = -x
coupling         = mirror
coupling_cadence = stage_coincident

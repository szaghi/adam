[IO]
output_basename = rj2a-y
it_save = 100000
restart_basename = rj2a-y-restart
restart_save = 0
residuals_save = 1
save_auxiliary_fields = .false.

[grid]
ni = 4
nj = 32
nk = 4
ngc = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .true.
null_z = .true.

[amr]
max_level = 2
ratio = 8
iu_ref_levels = 2

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme = weno-u-5

[fdv]
fdv_scheme = fd
fdv_order = 2

[physics]
physical_model = mhd-ideal
cp = 2.5
cv = 1.5

[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.

[bc_x_min]
type = extrapolation

[bc_x_max]
type = extrapolation

[bc_y_min]
type = extrapolation

[bc_y_max]
type = extrapolation

[bc_z_min]
type = extrapolation

[bc_z_max]
type = extrapolation

[initial_conditions]
type = riemann-problem
amr_iterations = 0

[initial_conditions_region_1]
r = 1.08
u = 0.5
v = 1.2
w = 0.01
p = 0.95
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 0.5
emax_z = 1.0
bx = 0.5641895835477563
by = 0.5641895835477563
bz = 1.0155412503859613

[initial_conditions_region_2]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 1.0
emin_x = 0.0
emin_y = 0.5
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
bx = 0.5641895835477563
by = 0.5641895835477563
bz = 1.1283791670955126

[time]
it_max = -1
time_max = 0.2
CFL = 0.5

[diagnostics]
conservation_history_save = 1

[mhd]
divergence_control = none
divb_tol = 0.0
divb_error = .false.
rho_floor = 0.0
p_floor = 0.0


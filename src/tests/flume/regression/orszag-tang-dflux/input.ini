; FLUME regression case (SELAH M7, ADAM #132, rule 3): orszag-tang with [diagnostics] divb_flux = .true. and it_save = 100: the
; D_flux diagnostic, whose residual evaluation borrows the time integrator's registers between steps, and its
; div(B) history compared by run.sh (*-divb_history.dat, absolute floor 1e-12). Goldens captured with the executables
; before SELAH. Changing it invalidates golden/.
[IO]
output_basename = orszag-tang
it_save = 100
restart_basename = vortex-n064-restart
restart_save = 0
residuals_save = 1
save_auxiliary_fields = .false.

[grid]
ni = 16
nj = 16
nk = 1
ngc = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_z = .true.

[amr]
max_level = 2
ratio = 4
iu_ref_levels = 2

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme = weno-u-5

[fdv]
fdv_scheme = fd
fdv_order = 2

[physics]
physical_model = mhd-ideal
cp = 2.5
cv = 1.5

[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.

[bc_x_min]
type = periodic

[bc_x_max]
type = periodic

[bc_y_min]
type = periodic

[bc_y_max]
type = periodic

[bc_z_min]
type = extrapolation

[bc_z_max]
type = extrapolation

[initial_conditions]
type = orszag-tang
amr_iterations = 0

[time]
it_max = 100
time_max = 1.0
CFL = 0.4

[diagnostics]
divb_flux = .true.
conservation_history_save = 1

[mhd]
divergence_control = glm
divb_tol = 0.0
divb_error = .false.
rho_floor = 0.0
p_floor = 0.0
glm_ch = 4.0
glm_alpha = 0.18
glm_damping_length = 1.0
glm_ch_check = error


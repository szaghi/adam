; FLUME regression case (SELAH M7, ADAM #132, rule 3): the well-balanced mode ([gravity] equilibrium = atmosphere), whose
; equilibrium residual borrows the time integrator's first register between steps, on 2:1 seams (the equilibrium's
; seam mismatch subtracted from the reflux). Written by verification/gravity/make_atmosphere.py strat2d-amr --balanced
; --pulse 1e-2 --steps 20 --it-save 20 (GV-8 with a pressure pulse, 20 steps), the four keys no parser reads removed
; ([amr] i_prune, j_prune, k_prune, [solids] n_eikonal: the generator predates #80). Goldens captured with the executables
; before SELAH. Changing it invalidates golden/.
[IO]
output_basename = strat2d-amr
it_save = 20
restart = .false.
restart_basename = strat2d-amr-restart
restart_save = 0
residuals_save = 1
save_residual_fields = .false.
save_auxiliary_fields = .false.
[grid]
ni = 8
nj = 8
nk = 1
ngc = 4
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.
[amr]
max_level = 3
ratio = 4
iu_ref_levels = 2
l_prune = -1
frequency = 0
iters = 1
markers_number = 1
[amr_marker_1]
mode = 1
geo_type = primitive-box
delta_type = max
delta_fine = 0.0
delta_coarse = 0.0
box_xmin = 0.25
box_ymin = 0.25
box_zmin = 0.0
box_xmax = 0.75
box_ymax = 0.75
box_zmax = 1.0
target_level = 3
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
[solids]
number = 0
[slices]
slices_number = 0
[physics]
physical_model = euler
gamma = 1.4
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = hydrostatic
[bc_y_max]
type = hydrostatic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation
[time]
it_max = 20
time_max = 1e+30
CFL = 0.4
[diagnostics]
ghost_poison = .true.
conservation_history_save = 1
[gravity]
g_y = -10.0
equilibrium = atmosphere
[initial_conditions]
type = isothermal-atmosphere
amr_iterations = 1
pulse_amplitude = 0.01
pulse_x = 0.5
pulse_y = 0.5
pulse_z = 0.5
pulse_width = 0.05
[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 1.0

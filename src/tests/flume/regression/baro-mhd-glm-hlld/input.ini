; FLUME regression baro-mhd-glm-hlld (issue #100, P5a): Mignone's tube 2 with the densities times 5 (make_eos_mhd.py
; tube --tube 2 --cells 200 --eos barotropic --rho-scale 5 --dc glm --scheme weno-riemann --solver hlld): mhd-ideal
; with the barotropic table POLY (c0 = 1, breaks 2 and 8, exponents 1, 1.4, 5/3; the states on the Gamma = 1.4
; segment), mixed GLM (c_h = 8), weno-riemann with the isothermal HLLD on P(rho), characteristic, 6th-order correction,
; 200 cells, to t = 0.2. Covers the barotropic MHD library, the HLLD and GLM kernels; changing it invalidates golden/.
; CPU P5a, FNL P5b.
[IO]
output_basename = baro-mhd-glm-hlld
it_save = 1000000
restart                = .false.
restart_basename       = sod-x-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni = 50
nj = 1
nk = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .true.
null_z = .true.

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = mhd-ideal

[numerics]
flux_correction_sensor = weno
flux_correction = 6th
riemann_solver = hlld
scheme_space = weno-riemann
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = riemann-problem
regions_number = 2
amr_iterations = 0

[initial_conditions_region_1]
bz = 0.5641895835477563
by = 1.0155412503859613
bx = 0.5641895835477563
r = 5.4
u = 1.2
v = 0.01
w = 0.5
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
bz = 0.5641895835477563
by = 1.1283791670955126
bx = 0.5641895835477563
r = 5.0
u = 0.0
v = 0.0
w = 0.0
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.2
CFL = 0.5

[diagnostics]
conservation_history_save = 1

[eos]
reference_density = 1.0
exponents = 1.0 1.4 1.6666666666666667
densities = 2.0 8.0
sound_speed = 1.0
type = barotropic

[mhd]
glm_ch_check = warning
glm_damping_length = 1.0
glm_alpha = 0.18
glm_ch = 8.0
p_floor = 0.0
rho_floor = 0.0
divb_error = .false.
divb_tol = 0.0
divergence_control = glm

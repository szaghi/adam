; FLUME regression case becker-shock (issue #65, M4-P6): frozen copy of a verification input, generated by
; verification/viscous/profiles.py; VV-4 Becker viscous shock, Mach 2, 64 cells, order 4, t = 0.01: the nonlinear viscous and heat fluxes.
[IO]
output_basename        = profile
it_save                = 1000000
restart                = .false.
restart_basename       = profile-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 16
nj     = 1
nk     = 1
ngc    = 3
emin_x = -0.25
emin_y = 0.0
emin_z = 0.0
emax_x = 0.25
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .true.
null_z = .true.

[amr]
max_level      = 2
ratio          = 4
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 0

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler
gamma          = 1.4
viscosity      = 0.005
prandtl        = 0.75

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.
dissipative_order        = 4

[time]
it_max   = -1
time_max = 0.01
CFL      = 0.2

[diagnostics]
conservation_history_save = 1

[bc_x_min]
type = inflow
r    = 1.0
u    = 2.0
v    = 0.0
w    = 0.0
p    = 0.7142857142857143
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = becker-shock
amr_iterations = 0
mach           = 2.0
shock_x0       = 0.0

[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.7142857142857143

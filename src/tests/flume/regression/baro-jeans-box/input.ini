; FLUME regression baro-jeans-box (issue #100, P4): the barotropic Jeans collapse on a static AMR grid
; (verification/eos make_eos_gravity.py jeansu --eos barotropic --cells 8 --box --amplitude 1e-2): POLY of eos_oracle.py on
; rho0 = 5 (c^2 = P'(5)), the unstable mode at amplitude 1e-2, 32^2 base with the central box refined 2:1, the
; multigrid Poisson solver, the seam reflux, SSP-33, 20 steps. Covers gravity on the momentum only (the energy row
; cleared, no seam gravity work) and the barotropic c^2 of the Jeans IC; changing it invalidates golden/. FFT executable.
[IO]
output_basename = baro-jeans-box
it_save = 1000000
restart = .false.
restart_basename = jeansu2d-restart
restart_save = 0
residuals_save = 1
save_memory_status = .false.
save_residual_fields = .false.
save_auxiliary_fields = .false.
save_curl_fields = .false.
save_divergence_fields = .false.
save_gradient_fields = .false.
save_laplacian_fields = .false.
[grid]
ni = 8
nj = 8
nk = 1
ngc = 4
emin_x = 0.125
emin_y = 0.125
emin_z = 0.0
emax_x = 1.125
emax_y = 1.125
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.
[amr]
max_level = 3
ratio = 4
iu_ref_levels = 2
i_prune = 0
j_prune = 0
k_prune = 0
l_prune = -1
frequency = 0
iters = 1
markers_number = 1
[amr_marker_1]
mode = 1
geo_type = primitive-box
delta_type = max
delta_fine = 0.0
delta_coarse = 0.0
box_xmin = 0.375
box_ymin = 0.375
box_zmin = 0.0
box_xmax = 0.875
box_ymax = 0.875
box_zmax = 1.0
target_level = 3
[field]
nv = 5
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
ror_number = 0
ror_threshold = 0.9
ror_vars_number = 0
enable_ror_stats = .false.
ib_reduction_extent = 0
ib_reduced_order = 2
[linear-algebra]
smoothing = gauss-seidel
iterations_init = 3
iterations_coarse = 10
iterations_fine = 3
iterations = 10
tolerance = 1.e-20
[fdv]
fdv_scheme = fd
fdv_order = 2
[solids]
number = 0
n_eikonal = 0
[slices]
slices_number = 0
[physics]
physical_model = euler
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation
[time]
it_max = 20
time_max = 0.2814543542094265
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 5.710793036423312
[initial_conditions]
type = sine-wave
amr_iterations = 1
wave_mode = jeans
wave_angle = 45.0
wave_amplitude = 0.01
wavelength = 0.7071067811865475
[initial_conditions_region_1]
r = 5.0
u = 0.0
v = 0.0
w = 0.0

[eos]
exponents = 1.0 1.4 1.6666666666666667
densities = 2.0 8.0
sound_speed = 1.0
type = barotropic

; FLUME regression case (issue #35, P8): frozen copy of verification/conservation/amr-periodic.ini. Changing it invalidates golden/.
; FLUME verification V3 (issue #35, section 11): conservation across AMR coarse-fine faces with reflux.
; Triply periodic box, 8^3 cells per block; one uniform level (8 blocks), then the octant [0, 0.5]^3 refined once more
; (15 blocks, 2:1 faces on every side of the octant, periodic neighbours included). Uniform flow (1, 1, 1) with a 1%
; seeded density/pressure perturbation, so every seam carries a flux. SSP-33, 20 steps. check.sh requires the five
; volume integrals to be constant to round-off with reflux, and to drift without (reflux = .false., negative control).
[IO]
output_basename        = amr-periodic
it_save                = 100000
restart                = .false.
restart_basename       = amr-periodic-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 8
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level      = 2
ratio          = 8
iu_ref_levels  = 1
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 999999
iters          = 1
markers_number = 1

[amr_marker_1]
mode         = 1             ; AMR_GEO (geometric marker)
geo_type     = primitive-box
delta_type   = max           ; unused by the box marker; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = 0.0           ; the octant [0, 0.5]^3: the block whose centroid is inside is refined
box_ymin     = 0.0
box_zmin     = 0.0
box_xmax     = 0.5
box_ymax     = 0.5
box_zmax     = 0.5
target_level = 2

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[initial_conditions]
type           = uniform
amr_iterations = 1
s              = 0.01 ; relative amplitude of the seeded density/pressure perturbation

[initial_conditions_region_1]
r = 1.0
u = 1.0
v = 1.0
w = 1.0
p = 1.0

[time]
it_max   = 20
time_max = 1.0
CFL      = 0.5

[diagnostics]
conservation_history_save = 1

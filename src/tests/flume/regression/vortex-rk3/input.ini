; FLUME regression case (issue #95, P4): vortex-periodic on the low-storage Runge-Kutta scheme runge-kutta-3, the only
; case on the low-storage path (rk_compute_stage_ls on both backends; every other case runs an SSP scheme, and the staged
; forest path refuses a low-storage scheme on AMR seams or multi-realm runs). Otherwise a frozen copy of
; vortex-periodic (verification/vortex/vortex-n064.ini, it_max = 100) except for three keys, so that the case can tell
; the time integrator: it_save = 100 (the final state enters the digest); CFL = 0.8 and time_max = 10 (it_max binds).
; At CFL 0.1 runge-kutta-3 and runge-kutta-ssp-54 agree to 1e-7, at 0.4 to 7e-5, both inside the digest tolerances;
; at 0.8 they differ by 4.5e-4 and the digest rejects the SSP-54 run. Changing it invalidates golden/.
[IO]
output_basename        = vortex-rk3
it_save                = 100
restart                = .false.
restart_basename       = vortex-rk3-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 16
nj     = 16
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 2
ratio          = 4
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-3

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = isentropic-vortex
amr_iterations = 0
x0             = 0.5
y0             = 0.5
radius         = 0.07
strength       = 5.0

[initial_conditions_region_1]
r = 1.0
u = 1.0
v = 1.0
w = 0.0
p = 1.0

[time]
it_max   = 100
time_max = 10.0
CFL      = 0.8

[diagnostics]
conservation_history_save = 1

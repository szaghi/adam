; FLUME regression iso-collide-hllc (issue #100, P2): two isothermal streams rho = 1, u = +-5 colliding at x = 0.5
; (verification/eos make_eos.py --case collide --ni 100 --level 2 --time-max 0.5 --scheme weno-riemann --solver hllc):
; 100 cells along x in four blocks, weno-riemann with the isothermal HLLC, characteristic interpolation, the 6th-order
; flux correction, to t = 0.5. Covers the isothermal Riemann kernels on two Mach-5 shocks and the dense layer at M^2;
; changing it invalidates golden/.
[IO]
output_basename = iso-collide-hllc
it_save                = 100000
restart                = .false.
restart_basename = iso-collide-hllc-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni = 25
nj     = 4
nk     = 4
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .true.
null_z = .true.

[amr]
max_level = 2
ratio          = 8
iu_ref_levels = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler

[numerics]
flux_correction_sensor = weno
flux_correction = 6th
riemann_solver = hllc
scheme_space = weno-riemann
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = riemann-problem
regions_number = 2
amr_iterations = 0

[initial_conditions_region_1]
r      = 1.0
u = 5.0
v      = 0.0
w      = 0.0
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
r = 1.0
u = -5.0
v      = 0.0
w      = 0.0
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.5
CFL = 0.5

[diagnostics]
conservation_history_save = 1

[eos]
sound_speed = 1.0
type = isothermal

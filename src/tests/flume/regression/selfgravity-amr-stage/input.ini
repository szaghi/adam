; FLUME regression case (issue #81, P6): self-gravity on a static AMR grid, the multigrid Poisson solver (coarsest
; level by FFT), the seam gravity work in the reflux, reflux_cadence = stage. Changing it invalidates golden/.
; make_jeans.py jeansc2d --box --reflux-cadence stage (SV-10): selfgravity-jeans with the central box refined one
; level more (2:1 seams the mode crosses), 20 steps. Runs on the FFT executable.
[IO]
output_basename = jeansc2d
it_save = 1000000
restart_basename = jeansc2d-restart
restart_save = 0
residuals_save = 1
save_auxiliary_fields = .false.
[grid]
ni = 8
nj = 8
nk = 1
ngc = 4
emin_x = 0.125
emin_y = 0.125
emin_z = 0.0
emax_x = 1.125
emax_y = 1.125
emax_z = 1.0
null_z = .true.
[amr]
max_level = 3
ratio = 4
iu_ref_levels = 2
[amr_marker_1]
mode = 1
geo_type = primitive-box
delta_type = max
delta_fine = 0.0
delta_coarse = 0.0
box_xmin = 0.375
box_ymin = 0.375
box_zmin = 0.0
box_xmax = 0.875
box_ymax = 0.875
box_zmax = 1.0
target_level = 3
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
[physics]
physical_model = euler
gamma = 1.6666666666666667
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
reflux_cadence = stage
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation
[time]
it_max = 20
time_max = 100.0
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 14.137166941154069
[initial_conditions]
type = sine-wave
amr_iterations = 1
wave_mode = jeans
wave_angle = 45.0
wave_amplitude = 0.01
wavelength = 0.7071067811865475
[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.6

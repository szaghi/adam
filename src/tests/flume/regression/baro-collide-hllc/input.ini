; FLUME regression baro-collide-hllc (issue #100, P3): the barotropic collision of verification/eos eb2, (1, 3.4) |
; (1.5, -2.6) on the table POLY (make_eos.py --case collide --eos barotropic ... --time-max 0.3 --ni 100 --level 2
; --scheme weno-riemann --solver hllc): both shocks into the Gamma = 5/3 segment, 100 cells in four blocks,
; weno-riemann with the barotropic HLLC (the HLL speeds from the Roe secant speed), the 6th-order flux correction.
; Covers the barotropic Riemann kernels; changing it invalidates golden/.
[IO]
output_basename = baro-collide-hllc
it_save                = 100000
restart                = .false.
restart_basename = baro-collide-hllc-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni = 25
nj     = 4
nk     = 4
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .true.
null_z = .true.

[amr]
max_level = 2
ratio          = 8
iu_ref_levels = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler

[numerics]
flux_correction_sensor = weno
flux_correction = 6th
riemann_solver = hllc
scheme_space = weno-riemann
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = extrapolation
[bc_x_max]
type = extrapolation
[bc_y_min]
type = extrapolation
[bc_y_max]
type = extrapolation
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = riemann-problem
regions_number = 2
amr_iterations = 0

[initial_conditions_region_1]
r = 1.0
u = 3.4
v      = 0.0
w      = 0.0
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
r = 1.5
u = -2.6
v      = 0.0
w      = 0.0
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.3
CFL = 0.5

[diagnostics]
conservation_history_save = 1

[eos]
exponents = 1.0 1.4 1.6666666666666667
densities = 2.0 8.0
sound_speed = 1.0
type = barotropic

; FLUME regression periodic-1block (issue #103): the isothermal acoustic wave of verification/eos (make_eos.py --case
; wave --ni 48) on ONE block, not refined at init ([amr] max_level = 0, iu_ref_levels = 0), every face periodic (x active,
; y and z null), WENO-5 flux splitting, to t = 1. The tree and the maps used to be built before the BC types were known:
; such a periodic face kept its boundary neighbours, the CPU stopped on the unknown crown row and the FNL left the periodic
; ghosts stale (the wave wrong by its whole amplitude). With every face periodic the BC crown map has no row (left
; unallocated). The run equals the 8-block run of the same wave bitwise, on CPU and FNL. Changing it invalidates golden/.
[IO]
output_basename = periodic-1block
it_save                = 100000
restart                = .false.
restart_basename       = sod-x-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni = 48
nj     = 4
nk     = 4
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .true.
null_z = .true.

[amr]
max_level = 0
ratio          = 8
iu_ref_levels = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler

[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[initial_conditions]
wavelength = 1.0
wave_amplitude = 1.0e-6
wave_angle = 0.0
wave_mode = acoustic
type = sine-wave
regions_number = 1
amr_iterations = 0

[initial_conditions_region_1]
r = 1.0
u      = 0.0
v      = 0.0
w      = 0.0
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
r = 1.0
u      = 0.0
v      = 0.0
w      = 0.0
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 1.0
CFL = 0.5

[diagnostics]
conservation_history_save = 1

[eos]
sound_speed = 1.0
type = isothermal

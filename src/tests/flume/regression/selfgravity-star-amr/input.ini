; FLUME regression case (issue #87, P4): isolated self-gravity on a static AMR grid, the multigrid's symmetric James
; step (two Dirichlet solves around the ghost-to-ghost lattice Green's function), the seam gravity work in the
; per-stage reflux. Changing it invalidates golden/. make_polytrope.py starc --radius 0.3 --box --reflux-cadence stage
; (SV-14): the collapsing n = 1 polytrope of radius 0.3 in a closed box, the box [-1/2,1/2]^3 refined once over the
; 32^3 base (120 blocks of 8^3), 20 steps. Runs on the FFT executable.
[IO]
output_basename = starc
it_save = 1000000
restart = .false.
restart_basename = starc-restart
restart_save = 0
residuals_save = 1
save_memory_status = .false.
save_residual_fields = .false.
save_auxiliary_fields = .false.
save_curl_fields = .false.
save_divergence_fields = .false.
save_gradient_fields = .false.
save_laplacian_fields = .false.
[grid]
ni = 8
nj = 8
nk = 8
ngc = 4
emin_x = -1.0
emin_y = -1.0
emin_z = -1.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.
[amr]
max_level = 3
ratio = 8
iu_ref_levels = 2
i_prune = 0
j_prune = 0
k_prune = 0
l_prune = -1
frequency = 0
iters = 1
markers_number = 1
[amr_marker_1]
mode = 1
geo_type = primitive-box
delta_type = max
delta_fine = 0.0
delta_coarse = 0.0
box_xmin = -0.5
box_ymin = -0.5
box_zmin = -0.5
box_xmax = 0.5
box_ymax = 0.5
box_zmax = 0.5
target_level = 3
[field]
nv = 5
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
ror_number = 0
ror_threshold = 0.9
ror_vars_number = 0
enable_ror_stats = .false.
ib_reduction_extent = 0
ib_reduced_order = 2
[linear-algebra]
smoothing = gauss-seidel
iterations_init = 3
iterations_coarse = 10
iterations_fine = 3
iterations = 10
tolerance = 1.e-20
[fdv]
fdv_scheme = fd
fdv_order = 2
[solids]
number = 0
n_eikonal = 0
[slices]
slices_number = 0
[physics]
physical_model = euler
gamma = 2.0
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
positivity_limiter = none
reflux_cadence = stage
[bc_x_min]
type = wall-inviscid
[bc_x_max]
type = wall-inviscid
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = wall-inviscid
[bc_z_max]
type = wall-inviscid
[time]
it_max = 20
time_max = 100.0
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 1.0
poisson_bc = isolated
[initial_conditions]
type = polytrope
amr_iterations = 1
star_radius = 0.3
star_density = 1.0
star_pressure_factor = 0.5
[initial_conditions_region_1]
r = 0.01
u = 0.0
v = 0.0
w = 0.0
p = 0.0005729577951308232

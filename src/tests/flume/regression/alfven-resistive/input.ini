; FLUME regression case alfven-resistive (issue #65, M4-P6): frozen copy of a verification input, generated by
; verification/viscous/waves.py; VV-5 visco-resistive Alfven wave at 45 degrees, MHD-GLM, B_n = 1, mu = 0.01, eta = 0.005, 32^2, t = 0.05.
[IO]
output_basename        = wave
it_save                = 1000000
restart                = .false.
restart_basename       = wave-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 2
ratio          = 4
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = mhd-ideal
gamma          = 1.4
viscosity      = 0.01
conductivity   = 0.0
resistivity    = 0.005

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.
dissipative_order        = 4

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = sine-wave
amr_iterations = 0
wave_mode      = magnetic
wave_angle     = 45.0
wave_amplitude = 1e-05
wavelength     = 0.7071067811865475

[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 1.0
bx = 0.7071067811865476
by = 0.7071067811865475
bz = 0.0

[time]
it_max   = -1
time_max = 0.05
CFL      = 0.2

[diagnostics]
conservation_history_save = 1

[mhd]
divergence_control = glm
divb_tol           = 0.0
divb_error         = .false.
rho_floor          = 0.0
p_floor            = 0.0
glm_ch             = 3.0
glm_alpha          = 0.0
glm_damping_length = 1.0
glm_ch_check       = error

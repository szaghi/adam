; FLUME regression case (SELAH M7, ADAM #132 box 0.4a): rj2a-2realm with the lagged (alpha, end_of_step) seam cadence, so
; that the time integrator's handling of the end-of-step seam ghosts (#113) has a regression anchor. Goldens captured
; with the develop executables before any SELAH wiring. Changing it invalidates golden/.
[forest]
realms_number = 2

[realm.1]
ini = rj2a-2realm-alpha-r1.ini

[realm.2]
ini = rj2a-2realm-alpha-r2.ini

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +x
realm_b          = 2
face_b           = -x
coupling         = mirror
coupling_cadence = end_of_step

; FLUME regression case (issue #81, P6): self-gravity on a uniform grid, the FFT Poisson solver. Changing it invalidates
; golden/. make_jeans.py jeansc2d (SV-4): the unstable Jeans mode at amplitude 1e-2 (G = 9 pi/2), 2-D periodic, 32^2
; cells (4x4 blocks of 8^2), SSP-33, 20 steps; [time] fixed to 20 steps. Runs on the FFT executable (run.sh selects
; it for every case with self_gravity = .true.).
[IO]
output_basename = jeansc2d
it_save = 1000000
restart = .false.
restart_basename = jeansc2d-restart
restart_save = 0
residuals_save = 1
save_memory_status = .false.
save_residual_fields = .false.
save_auxiliary_fields = .false.
save_curl_fields = .false.
save_divergence_fields = .false.
save_gradient_fields = .false.
save_laplacian_fields = .false.
[grid]
ni = 8
nj = 8
nk = 1
ngc = 4
emin_x = 0.125
emin_y = 0.125
emin_z = 0.0
emax_x = 1.125
emax_y = 1.125
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.
[amr]
max_level = 2
ratio = 4
iu_ref_levels = 2
i_prune = 0
j_prune = 0
k_prune = 0
l_prune = -1
frequency = 0
iters = 1
markers_number = 0
[field]
nv = 5
[runge_kutta]
scheme = runge-kutta-ssp-33
[weno]
scheme = weno-u-5
ror_number = 0
ror_threshold = 0.9
ror_vars_number = 0
enable_ror_stats = .false.
ib_reduction_extent = 0
ib_reduced_order = 2
[linear-algebra]
smoothing = gauss-seidel
iterations_init = 3
iterations_coarse = 10
iterations_fine = 3
iterations = 10
tolerance = 1.e-20
[fdv]
fdv_scheme = fd
fdv_order = 2
[solids]
number = 0
n_eikonal = 0
[slices]
slices_number = 0
[physics]
physical_model = euler
gamma = 1.6666666666666667
[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type = periodic
[bc_y_max]
type = periodic
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation
[time]
it_max = 20
time_max = 100.0
CFL = 0.4
[diagnostics]
conservation_history_save = 1
[gravity]
self_gravity = .true.
G = 14.137166941154069
[initial_conditions]
type = sine-wave
amr_iterations = 0
wave_mode = jeans
wave_angle = 45.0
wave_amplitude = 0.01
wavelength = 0.7071067811865475
[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 0.6

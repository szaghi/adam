; FLUME regression case (issue #37): frozen copy of verification/multirealm/sod-amr-2realm.ini (forest manifest).
; Changing it or its realm INIs invalidates golden/.
; FLUME forest manifest (issue #37), seam + AMR leg: sod-2realm.ini with realm 2 refined on x in [0.75, 1]
; (sod-amr-2realm-r2.ini), the refinement of the single-realm reference sod-amr.ini. Realm 2 then carries both kinds of
; reflux register face: the intra-realm 2:1 face at x = 0.75, crossed by the shock at t ~ 0.14, and the fine side of the
; inter-realm seam at x = 0.5, whose blocks stay at the same level on both sides (mirror coupling needs equal
; resolution). Beta (stage-coincident) cadence, SSP-33 in both realms. check.sh requires the union to reproduce the
; single-realm sod-amr bit for bit.

[forest]
realms_number = 2

[realm.1]
ini = sod-amr-2realm-r1.ini

[realm.2]
ini = sod-amr-2realm-r2.ini

[forest.topology]
inter_realm_faces_number = 1

[forest.topology.face_1]
realm_a          = 1
face_a           = +x
realm_b          = 2
face_b           = -x
coupling         = mirror
coupling_cadence = stage_coincident

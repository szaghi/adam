; Realm 2 of sod-amr-2realm: realm 1 (sod-amr-2realm-r1.ini) with the options below changed (`extends`, issue #80 P4).
extends = sod-amr-2realm-r1.ini

[IO]
output_basename        = sod-amr-2realm-r2
restart_basename       = sod-amr-2realm-r2-restart

[grid]
emin_x = 0.5
emax_x = 1.0

[amr]
max_level      = 3
markers_number = 1

[amr_marker_1]
mode         = 1             ; AMR_GEO (geometric marker)
geo_type     = primitive-box
delta_type   = max           ; unused by the box marker; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = 0.75          ; the blocks whose centroid is in x > 0.75 are refined once more
box_ymin     = 0.0
box_zmin     = 0.0
box_xmax     = 1.0
box_ymax     = 1.0
box_zmax     = 1.0
target_level = 3

[initial_conditions]
amr_iterations = 1

; FLUME regression case kolmogorov-channel (issue #133, phase 2): the local Kolmogorov resolution marker r = h/eta
; (mode 7) at runtime regrids. A 2-D laminar plane channel (the T3 channel IC, Poiseuille profile, walls at y = +-1,
; periodic x, Re = 100 on the half height, Mach 0.3), base level 2 on 4 x 4 blocks of 8 x 8 anisotropic cells
; (dx = 2 dy, so h = sqrt(dx dy)), a regrid every 5 steps, 10 steps: the marker reads r^2 = h^2 |dU/dy| / nu, largest at
; the walls; the thresholds put both regrids to work (step 5: every block to level 3; step 10: the wall layers to level
; 4, the core kept; an offline numpy evaluation of r on the step-5 checkpoint finds the same 16 blocks above 0.7). No
; block coarsens: in a steady flow the band (derefine_tol < refine_tol / 2, r halves across a level) keeps every block
; the marker refined, so the coarsening vote is not exercised here. Changing it invalidates golden/.
[IO]
output_basename        = channel
it_save                = 5
restart_basename       = channel-restart
restart_save           = 0
residuals_save         = 1
save_auxiliary_fields  = .false.

[grid]
ni     = 8
nj     = 8
nk     = 1
ngc    = 3
emin_x = 0.0
emin_y = -1.0
emin_z = 0.0
emax_x = 4.0
emax_y = 1.0
emax_z = 1.0
null_z = .true.

[amr]
max_level      = 4
ratio          = 4
iu_ref_levels  = 2
frequency      = 5
iters          = 1

[amr_marker_1]
mode         = 7             ; local Kolmogorov resolution r = h/eta (issue #133)
delta_type   = max           ; unused by mode 7; required by the common marker parse
delta_fine   = 0.0
delta_coarse = 0.0
refine_tol   = 0.7
derefine_tol = 0.3

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme = weno-u-5

[physics]
physical_model = euler
gamma          = 1.4
reynolds       = 100.0
prandtl        = 0.7

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type             = wall-isothermal
wall_temperature = 7.936507936507937
[bc_y_max]
type             = wall-isothermal
wall_temperature = 7.936507936507937
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = channel
amr_iterations = 0
ch_rho         = 1.0
ch_ub          = 1.0
ch_mach        = 0.3
ch_h           = 1.0
ch_lx          = 4.0
ch_lz          = 1.0
ch_pert        = 0.0

[time]
it_max   = 10
time_max = 100.0
CFL      = 0.4

[diagnostics]
conservation_history_save = 1

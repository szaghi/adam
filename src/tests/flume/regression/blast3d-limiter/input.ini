; FLUME regression case (issue #47, M3-P6): the Balsara-Spicer blast as a sphere on the periodic [0, 1]^3, written by
; verification/mhd/positivity-probe/make_blast.py --cells 32 --eglm --3d (octree, 4x4x4 blocks of 8^3), with
; positivity_limiter = cell and it_max = 40: the 3-D paths of EGLM and of the limiter (2^6 corners per cell).
; Changing it invalidates golden/.
[IO]
output_basename = blast3d-limiter
it_save = 100000
restart = .false.
restart_basename = vortex-n064-restart
restart_save = 0
residuals_save = 1
save_memory_status = .false.
save_residual_fields = .false.
save_auxiliary_fields = .false.
save_curl_fields = .false.
save_divergence_fields = .false.
save_gradient_fields = .false.
save_laplacian_fields = .false.

[grid]
ni = 8
nj = 8
nk = 8
ngc = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level = 2
ratio = 8
iu_ref_levels = 2
i_prune = 0
j_prune = 0
k_prune = 0
l_prune = -1
frequency = 999999
iters = 1
markers_number = 0

[field]
nv = 9

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme = weno-u-5
ror_number = 0
ror_threshold = 0.9
ror_vars_number = 0
enable_ror_stats = .false.
ib_reduction_extent = 0
ib_reduced_order = 2

[linear-algebra]
smoothing = gauss-seidel
iterations_init = 3
iterations_coarse = 10
iterations_fine = 3
iterations = 10
tolerance = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order = 2

[solids]
number = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = mhd-ideal
cp = 1.4
cv = 1.0

[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.
positivity_limiter = cell

[bc_x_min]
type = periodic

[bc_x_max]
type = periodic

[bc_y_min]
type = periodic

[bc_y_max]
type = periodic

[bc_z_min]
type = periodic

[bc_z_max]
type = periodic

[time]
it_max = 40
time_max = 0.01
CFL = 0.4

[diagnostics]
conservation_history_save = 1

[mhd]
divergence_control = eglm
divb_tol = 0.0
divb_error = .false.
rho_floor = 0.0
p_floor = 0.0
glm_ch = 60.0
glm_alpha = 0.18
glm_damping_length = 1.0
glm_ch_check = warning

[initial_conditions]
type = riemann-problem
amr_iterations = 0
regions_number = 33


[IO]
output_basename = glm-pulse
it_save = 100000
restart_basename = glm-pulse-restart
restart_save = 0
residuals_save = 1
save_auxiliary_fields = .false.

[grid]
ni = 32
nj = 2
nk = 2
ngc = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_y = .true.
null_z = .true.

[amr]
max_level = 2
ratio = 8
iu_ref_levels = 2

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme = weno-u-5

[fdv]
fdv_scheme = fd
fdv_order = 2

[physics]
physical_model = mhd-ideal
cp = 2.5
cv = 1.5

[numerics]
scheme_space = weno
reconstruction_variables = characteristic
reflux = .true.

[bc_x_min]
type = periodic

[bc_x_max]
type = periodic

[bc_y_min]
type = extrapolation

[bc_y_max]
type = extrapolation

[bc_z_min]
type = extrapolation

[bc_z_max]
type = extrapolation

[initial_conditions]
type = glm-pulse
amr_iterations = 0
pulse_axis = x
pulse_center = 0.5
pulse_width = 0.1
pulse_amplitude = 0.1

[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 1.0
bx = 0.0
by = 0.0
bz = 0.0

[time]
it_max = -1
time_max = 0.3
CFL = 0.5

[diagnostics]
conservation_history_save = 1

[mhd]
divergence_control = glm
divb_tol = 0.0
divb_error = .false.
rho_floor = 0.0
p_floor = 0.0
glm_ch = 2.0
glm_alpha = 0.0
glm_damping_length = 1.0
glm_ch_check = error


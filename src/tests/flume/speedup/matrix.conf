# FLUME speedup matrix: the parameters shared by make_inputs.py, run.sh and analyze.py (KEY=VALUE, bash-sourceable).
#
# The grid is still to be decided: every TBD below must be a number before make_inputs.py writes runnable inputs (it
# writes TBD into the inputs, and run.sh refuses an input that still holds one). Everything else is wired.
#
# Spacing: the domain is the unit square/cube, so a block at level L has 2^L blocks per active axis and the cell size
#   h(L) = 1 / (NI * 2^L).
# The noamr cases are uniform at MAX_LEVEL (the finest level of the amr cases): the AMR speedup compares the two at the
# same finest resolution.

# 2-D shock over a cylinder (xy-quad, xy-oct, xz-oct, yz-oct)
CYL_NI=TBD          # cells per block along each active axis (even, >= 6: 2 ngc along a refined axis)
CYL_BASE_LEVEL=TBD  # amr cases: the uniform base level (iu_ref_levels), the coarsest level a block derefines to
CYL_MAX_LEVEL=TBD   # amr cases: the finest level (max_level); noamr cases: the uniform level

# 3-D shock over a sphere (xyz, octree)
SPH_NI=TBD
SPH_BASE_LEVEL=TBD
SPH_MAX_LEVEL=TBD

# Octree 2-D runs: cells per block along the null axis (4: the 2:1 seam fill needs nk >= 4 along an octree axis, and
# the verified V6 cylinder uses 4). An octree also splits its null axis at every level: 4 * 2^L cells per column.
OCT_NULL_CELLS=4

# Dynamic AMR (amr cases): a regrid every AMR_FREQUENCY steps, one gradient-of-density marker. Its tolerance is
# absolute (|grad rho|, density per length), so it is derived from the grid: tol = GRAD_TOL_FACTOR * drho / h(BASE),
# drho = 2.3333 the density jump of the incident shock (a captured shock is ~3 cells wide, |grad rho| ~ drho / 3h).
AMR_FREQUENCY=10
GRAD_TOL_FACTOR=0.1

# Physical times: the shock starts at x = 0.2 and runs at speed 2 into the body (radius 0.13 at the domain centre).
T_WARM=0.15   # end of the warmup: the incident shock is at mid-body, the reflected bow shock forming
T_END=0.25    # end of the full simulations (the V6 time: the shock has passed the body)
CFL=0.5

# Measurement window (data/): after the warmup restart, a short run of N1 steps and a long run of N1 + NWIN steps,
# REPEATS times interleaved; the cost of NWIN steps is the difference. N1 and NWIN must be multiples of AMR_FREQUENCY,
# so that both runs hold whole regrid periods (the regrid cadence keys on the step count, which the restart restores).
N1=10
NWIN=100
REPEATS=3

# Full simulations (full/): one per case of FULL_CASES; checkpoints at the first and last step, and every FULL_IT_SAVE.
FULL_CASES="xy-quad-shock-cylinder-noamr xy-quad-shock-cylinder-amr xyz-shock-sphere-noamr xyz-shock-sphere-amr"
FULL_IT_SAVE=1000000

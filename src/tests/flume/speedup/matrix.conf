; FLUME speedup matrix (issue #133): every parameter of the cases and of the measurement protocol.
;
; make_cases.py reads this file and writes one directory per case (inputs, case.conf, README.md); run.sh reads the
; case.conf files, never this one. Edit here, then regenerate (run.sh does it at every call).
;
; [protocol] is the window of every leg (#133, "Measurement protocol"); [leg.N] one leg (flow) with its three cases;
; [leg.N.reduced] overrides keys of [leg.N] and of [protocol] for `make_cases.py --reduced` (the WSL plumbing test: coarse
; levels, a few steps, seconds per run; its timings mean nothing). A leg's three cases are named by role:
;   uniform  the uniform grid at the finest level (case a): the warm-up runs it, its windows restart from the warm-up
;   runtime  runtime AMR from base_level up to max_level: the settle runs it from the warm-up dump, its windows restart
;            from the settle dump
;   frozen   the runtime case with [amr] frequency = 0, restarted from the settle dump (D2: same grid, same state)
; Leg 1 names them 1a/1b/1c with 1b frozen and 1c runtime; legs 2 and 3 with b runtime and c frozen (the plan's table).
; [weak.<case>] (phase 9, at the end of this file) adds uniform cases of a leg at other sizes, for weak scaling.
;
; Keys common to every leg:
;   t_w            warm-up end time (time-driven); warmup_steps > 0 replaces it by a step count (reduced only)
;   settle_steps   steps of the settle run (runtime case restarted from the warm-up dump)
;   regrid_period  [amr] frequency of the runtime case; window_short and window_long must be multiples of it
;   cfl            CFL number

[protocol]
window_short   = 10          ; steps of the short run of a window
window_long    = 110         ; steps of the long run; step cost = median(T_loop(long) - T_loop(short)) / (long - short)
repetitions    = 3           ; interleaved repetitions of the short and long runs
spread_warning = 0.02        ; warn when (max - min) / median of the repetitions exceeds this
huge           = 1000000000  ; the cadence of an output written only at the first and last step of a run
load_tolerance = 0.10        ; analyze.py: windows of one series whose cells per device agree within this fraction are
                             ; one weak-scaling group (phase 9)

[leg.1]
title         = Woodward-Colella Mach 3 forward-facing step, 3-realm forest (aligned blocks, auto seams), 2-D quadtrees
generator     = step         ; verification/step/make_step.py --layout aligned --dims 2
; the scaling series of the uniform case and of the [weak.*] cases of this leg (analyze.py, phase 9)
series        = step
series_label  = Mach 3 step, 2-D forest, WENO-7: memory-capped 2-D, launch-bound regime (H1), ~1 M cells per A30;
                not a grind measurement (the block shape changes with m)
uniform       = 1a-step-uniform
runtime       = 1c-step-runtime
frozen        = 1b-step-fixed
m             = 16           ; block cells along A's y: A (3m, m), B (3m, 4m), C (12m, 4m); h = 0.2/(m 2^L)
; WENO-9 failed gate 4.1, t = 3.62 at the corner, medooza st-J1 1369311; WENO-7 pending its gate (#133 phase 4).
; t_w = 2.0 below is well before that failure time.
weno          = 7
base_level    = 1            ; h(base) = 1/160
max_level     = 4            ; h(finest) = 1/1280, the uniform case's level
t_w           = 2.0          ; Mach stem, reflected shocks and slip line formed (check the warm-up's last checkpoint)
settle_steps  = 100
regrid_period = 10
cfl           = 0.5
marker        = lohner       ; make_step.py's density marker (Loehner); `gradient` takes tol_factor instead
refine_tol    = 0.3
derefine_tol  = 0.1
buffer        = -1           ; ghost layers the Loehner estimator reads; -1: ngc - 1 (make_step.py's choice)

[leg.1.reduced]
m             = 8            ; the least even count >= 2 ngc at WENO-7
base_level    = 0
max_level     = 1
warmup_steps  = 6
settle_steps  = 4
regrid_period = 2
window_short  = 2
window_long   = 6

[leg.2]
title         = Mach 2 shock diffraction over a sphere, immersed boundary (Euler wall), 3-D octree
generator     = sphere       ; speedup/make_sphere.py
series        = sphere
series_label  = shock over a sphere, 3-D octree, WENO-5, 24^3 blocks: the weak-scaling and grind-time series
uniform       = 2a-sphere-uniform
runtime       = 2b-sphere-runtime
frozen        = 2c-sphere-fixed
block         = 24           ; cells per block along each axis
base_level    = 2            ; h(base) = 1/96
max_level     = 4            ; h(finest) = 1/384, 50 cells per radius
mach          = 2.0
shock_x       = 0.2
radius        = 0.13
weno          = 5
t_w           = 0.15         ; the shock at mid-body
settle_steps  = 100
regrid_period = 10
cfl           = 0.5
marker        = gradient     ; density gradient, tol = tol_factor * drho / h(base), drho the incident jump
tol_factor    = 0.1

[leg.2.reduced]
block         = 8
base_level    = 1
max_level     = 2
warmup_steps  = 4
settle_steps  = 4
regrid_period = 2
window_short  = 2
window_long   = 4

[leg.3]
title         = Coleman-Kim-Moser channel, M_b 1.5, Re_b 3000, isothermal walls, periodic x and z, 3-D octree
generator     = channel      ; verification/turbulence/make_channel.py
uniform       = 3a-channel-uniform
runtime       = 3b-channel-runtime
frozen        = 3c-channel-fixed
; 256 x 192 x 128 cells at L3 in blocks of 32 x 24 x 16 (make_channel.py --levels 3: nx / 2^3 cells per block), base
; L2. The T3 resolved-hybrid dump has L2 blocks of 64 x 48 x 32, on which the runtime case cannot coarsen the core
; (phase 7.2: an L1 block is a half channel, wall to centreline, so every L1 parent has 4 wall blocks of its 8), and
; load_blocks refuses it here as it is: RE-BLOCK it first (each block into its 8 children, the same cells, bitwise),
;    reblock.py <T3 dir> --out <out dir>
; then give it to the warm-up: run.sh warmup --cases 3 --use-dump <out dir>
nx            = 256
ny            = 192
nz            = 128
base_level    = 2
max_level     = 3
mach          = 1.5
reynolds      = 3000
power_law     = 0.7
scheme_space  = hybrid-kep-weno
perturbation  = 0.2
t_w           = 150          ; a developed channel; a surviving T3 resolved-hybrid dump replaces the run (run.sh warmup --use-dump)
settle_steps  = 4000         ; one eddy turnover h/u_tau ~ 14
regrid_period = 10
cfl           = 0.5
marker        = kolmogorov   ; r = h/eta, [amr_marker_1] mode = 7 (#133 phase 2)
; Phase 7.2, a priori (kolmogorov_apriori.py on the settle dump, step 55626, and the T3 dump, step 51626; Re_tau 202,
; h+ 5.2): block r_max 5.3-9.4 on the 32 wall blocks (|y| > 0.5), 2.0-4.1 on the 32 core blocks; one level coarser
; (restricted field, 2h), on parents of 64 x 48 x 32 L3 cells, 10.2-14.4 on the wall halves, 3.8-7.2 in the core.
; derefine 4.4 (between the core's 4.06 and the wall's 5.34) derefines exactly the core; refine 9.5 keeps it coarse
; (above its 7.2) and refines back a wall parent derefined by a fluctuation (below the wall's 10.2); 4.4 < 9.5 / 2.
; On the dump's L2 layout no pair gives a core-coarse grid: derefine below 5.3, nothing derefines (64 L2 blocks, as
; with the former placeholders 4.0 / 1.9, which never regridded in the 4000 settle steps); above 9.4 (refine above
; 18.8) everything does (uniform L1, 8 blocks); between, an x-z subset of half channels set by the wall maxima.
; The pair acts with blocks of 32 x 24 x 16 at L3 (max_level 3, base_level 2, the T3 dump re-blocked): predicted
; 256 L3 blocks (|y| > 0.5) + 32 L2 blocks (core), 3,538,944 cells, 56 % of 3a (ideal AMR speedup 1.78)
refine_tol    = 9.5
derefine_tol  = 4.4

[leg.3.reduced]
nx            = 32
ny            = 32
nz            = 16
base_level    = 0
max_level     = 1
warmup_steps  = 4
settle_steps  = 4
regrid_period = 2
window_short  = 2
window_long   = 4

; ---- Weak scaling (phase 9, owner 2026-11-23) --------------------------------------------------------------------------
; [weak.<case>] is one more UNIFORM case of the leg `leg`, at another size: the keys of [protocol], [leg.N], [weak] and
; [weak.<case>], in this order; with --reduced, then those of [leg.N.reduced], [weak.reduced] and [weak.<case>.reduced].
; No runtime or frozen twin, no settle: its warm-up is a cold start of warmup_steps steps (the per-cell cost of a uniform
; WENO grid does not depend on the flow state), into its own dump <work>/dumps/<case>/warmup/; the window is the
; protocol's. The name must start with `w`: run.sh --cases 1 or 2 (leg prefixes) never selects a weak case, and
; --cases all leaves them out (select them with --cases w, w1, w2 or a name).
; The leg's `series` joins them with the leg's own uniform case (1a, 2a: their windows are reused, no new dump);
; analyze.py groups the windows of a series by cells per device (load_tolerance) and gives the weak efficiency of each
; group against its smallest device count. Cells per A30 in the comments; memory in README.md, "Multi-node and weak
; scaling (phase 9)".

[weak]
warmup_steps  = 20

[weak.reduced]
warmup_steps  = 2

; step: ~1.03 M cells per A30 (1a = m 16 on 4 A30); h = 0.2/(m 2^4) changes with m, the block shape too
[weak.w1-step-m8]
leg           = 1
m             = 8            ; 63 m^2 4^4 = 1.03 M cells: 1 A30

[weak.w1-step-m8.reduced]
max_level     = 0            ; 4,032 cells on 1 rank = 1a reduced (m 8, L1: 16,128 cells) on 4 ranks

[weak.w1-step-m22]
leg           = 1
m             = 22           ; 7.81 M cells: 8 A30, 0.976 M per A30 (m^2 = 512 has no even root; 5.4 % below the series)

[weak.w1-step-m22.reduced]
m             = 12
max_level     = 0            ; 9,072 cells on 2 ranks: 4,536 per rank, outside the 10 % group (plumbing only)

[weak.w1-step-m32]
leg           = 1
m             = 32           ; 16.5 M cells: 16 A30

[weak.w1-step-m32.reduced]
m             = 16
max_level     = 0            ; 16,128 cells on 4 ranks: 4,032 per rank, the load of w1-step-m8 reduced on 1

; sphere: 7.08 M cells per A30 (L3 on 1, L4 = 2a on 8) and 14.2 M (2a on 4, L5 on 32); the grind curve adds L3 on 2 and
; 4, 2a on 16 and 32 (rank counts of these cases, no new case)
[weak.w2-sphere-l3]
leg           = 2
max_level     = 3            ; 192^3 = 7.08 M cells, 512 blocks

[weak.w2-sphere-l3.reduced]
max_level     = 1            ; blocks of 8 (leg 2 reduced): 4,096 cells on 1 rank

[weak.w2-sphere-l5]
leg           = 2
max_level     = 5            ; 768^3 = 453 M cells, 32,768 blocks: 32 A30 (8 nodes); a dump of ~35 GB

[weak.w2-sphere-l5.reduced]
block         = 10
max_level     = 1            ; 8,000 cells on 2 ranks: 4,000 per rank, w2-sphere-l3 reduced's load on 1 (2.3 % below)

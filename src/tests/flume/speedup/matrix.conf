# FLUME speedup matrix: the parameters shared by make_inputs.py, run.sh and analyze.py (KEY=VALUE, bash-sourceable).
#
# A TBD left below is written into the inputs, and run.sh refuses an input that still holds one.
#
# Spacing: the domain is the unit square/cube, so a block at level L has 2^L blocks per active axis and the cell size
#   h(L) = 1 / (NI * 2^L).
# The noamr level is independent of the amr levels (owner decision 2026-10-21): the noamr cases are a fixed-grid
# reference sized to run on every leg (medooza: 4 A30 of 24 GB), the amr cases go deeper so that they load the GPUs.
# The equal-resolution AMR speedup is therefore an estimate (analyze.py: the noamr cost per cell-step times the cells
# of a uniform grid at the amr finest level).
#
# Sizes (estimates; the regrid lines of the logs print the real block counts):
#   cylinder noamr L4: quad 256 blocks, 0.26 M cells; oct 4096 blocks, 16.8 M cells, ~26 GB
#   cylinder amr L2-5: quad ~160 blocks, ~0.16 M cells; oct ~3600 blocks, ~15 M cells, ~23 GB
#   sphere   noamr L4: 4096 blocks, 16.8 M cells, ~19 GB;   amr L2-5: ~2900 blocks, ~12 M cells, ~13 GB

# 2-D shock over a cylinder (xy-quad, xy-oct, xz-oct, yz-oct)
CYL_NI=32            # cells per block along each active axis (even, >= 6: 2 ngc along a refined axis)
CYL_NOAMR_LEVEL=4    # noamr cases: the uniform level (h = 1/512)
CYL_BASE_LEVEL=2     # amr cases: the uniform base level (iu_ref_levels), the coarsest level a block derefines to
CYL_MAX_LEVEL=5      # amr cases: the finest level (max_level, h = 1/1024)

# 3-D shock over a sphere (xyz, octree)
SPH_NI=16
SPH_NOAMR_LEVEL=4    # h = 1/256
SPH_BASE_LEVEL=2
SPH_MAX_LEVEL=5      # h = 1/512

# Heavy quadtree (xy-quad-heavy, every leg): the 2-D production path at a size that loads a GPU. NI 64 also lowers the
# quadtree's ghost overhead (its blocks carry 2 ngc ghost layers along the null axis: 1 cell stored as 7).
#   noamr L6: 4096 blocks, 16.8 M cells, ~62 GB (4 A30: ~15 GB each), h = 1/4096, ~3700 warmup steps
#   amr L3-7: ~700 blocks, ~2.9 M cells, ~11 GB, h = 1/512 -> 1/8192, ~7400 warmup steps
# A 2-D amr case cannot be made heavy: its refined region is lines (the shock, the ring around the body), so its cells
# grow as 1/h while its steps grow as 1/h too; 16 M amr cells would need h ~ 1/50000 and ~45000 warmup steps.
QH_NI=64
QH_NOAMR_LEVEL=6
QH_BASE_LEVEL=3
QH_MAX_LEVEL=7

# AMD-only flows (fnl-amd: 8 GPUs of 192 GB); run.sh skips them on the other legs unless --cases names them.
AMD_ONLY_FLOWS="xy-quad-amd-shock-cylinder xyz-amd-shock-sphere"
#   xy-quad-amd   noamr L6: 4096 blocks, 67 M cells, ~226 GB (the node, ~28 GB per GPU), h = 1/8192, ~7400 warmup steps
#                 amr L2-7: ~650 blocks, ~10 M cells, ~36 GB, h = 1/512 -> 1/16384, ~14700 warmup steps (light: 2-D)
#   xyz-amd       noamr L4: 4096 blocks, 134 M cells, ~99 GB (one GPU, 61 % of its budget; or 8 GPUs, 17 M cells
#                 each), h = 1/512, ~460 warmup steps
#                 amr L2-6: ~10000 blocks, ~330 M cells, ~240 GB (the node, ~30 GB per GPU), h = 1/128 -> 1/2048,
#                 ~1840 warmup steps
AQ_NI=128
AQ_NOAMR_LEVEL=6
AQ_BASE_LEVEL=2
AQ_MAX_LEVEL=7
AS_NI=32             # 32^3 blocks: 0.74 KB per cell against 1.1 KB at 16^3 (a smaller ghost share)
AS_NOAMR_LEVEL=4
AS_BASE_LEVEL=2
AS_MAX_LEVEL=6

# Octree 2-D runs: cells per block along the null axis (4: the 2:1 seam fill needs nk >= 4 along an octree axis, and
# the verified V6 cylinder uses 4). An octree also splits its null axis at every level: 4 * 2^L cells per column.
OCT_NULL_CELLS=4

# Dynamic AMR (amr cases): a regrid every AMR_FREQUENCY steps, one gradient-of-density marker. Its tolerance is
# absolute (|grad rho|, density per length), so it is derived from the grid: tol = GRAD_TOL_FACTOR * drho / h(BASE),
# drho = 2.3333 the density jump of the incident shock (a captured shock is ~3 cells wide, |grad rho| ~ drho / 3h).
AMR_FREQUENCY=10
GRAD_TOL_FACTOR=0.1

# Physical times: the shock starts at x = 0.2 and runs at speed 2 into the body (radius 0.13 at the domain centre).
T_WARM=0.15   # end of the warmup: the incident shock is at mid-body, the reflected bow shock forming
T_END=0.25    # end of the full simulations (the V6 time: the shock has passed the body)
CFL=0.5

# Measurement window (data/): after the warmup restart, a short run of N1 steps and a long run of N1 + NWIN steps,
# REPEATS times interleaved; the cost of NWIN steps is the difference. N1 and NWIN must be multiples of AMR_FREQUENCY,
# so that both runs hold whole regrid periods (the regrid cadence keys on the step count, which the restart restores).
N1=10
NWIN=100
REPEATS=3

# Full simulations (full/): one per case of FULL_CASES; checkpoints at the first and last step, and every FULL_IT_SAVE.
FULL_CASES="xy-quad-shock-cylinder-noamr xy-quad-shock-cylinder-amr xyz-shock-sphere-noamr xyz-shock-sphere-amr"
FULL_IT_SAVE=1000000

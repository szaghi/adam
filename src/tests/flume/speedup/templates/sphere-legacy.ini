; STALE TEMPLATE, DOES NOT RUN: leg 2's starting point (issue #133), kept from the removed speedup matrix
; (xyz-shock-sphere-amr/input.ini, written by the deleted make_inputs.py, develop 0bcdf870).
;
; It is FLUME's only 3-D shock-over-a-sphere input (immersed boundary, octree, runtime AMR), so it is kept as a
; record of the flow, not as a case. It predates #80 and #132/#139: [field], [fdv], save_memory_status and
; i/j/k_prune are removed keys, and `unused_keys = error` (the default) refuses the file. Regenerate leg 2's inputs
; from it with the phase 3 generator (make_cases.py); do not run or patch this file.
;
; FLUME speedup matrix, case xyz-shock-sphere-amr (make_inputs.py: edit matrix.conf and rerun, not this file)
; Mach 2 shock over a sphere, streamwise axis x, 3-D octree; dynamic AMR, levels 2..5, gradient-of-density marker
[IO]
output_basename        = shock-sphere
it_save                = 1000000
restart                = .false.
restart_basename       = shock-sphere-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level      = 5
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 10
iters          = 3
markers_number = 1

[amr_marker_1]
mode         = 2             ; gradient
delta_type   = max
delta_fine   = 0.001953125001953125   ; finest spacing: blocks where |grad rho| > tol
delta_coarse = 0.015625000015625   ; base spacing: every other block derefines to it
field        = 1             ; conservative variables
var          = 1             ; density
tol          = 14.933333333333335   ; 0.1 * drho / h(base), drho = 2.3333

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 1
n_eikonal = 2

[solid_1]
name            = sphere
bc_type         = 2                 ; Euler wall
definition      = analytical_sphere
sphere_center_x = 0.5
sphere_center_y = 0.5
sphere_center_z = 0.5
sphere_radius   = 0.13

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = inflow
r = 3.7333333333333334
u = 1.25
v = 0.0
w = 0.0
p = 4.5
[bc_x_max]
type = extrapolation
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = wall-inviscid
[bc_z_max]
type = wall-inviscid

[initial_conditions]
type           = riemann-problem
regions_number = 2
amr_iterations = 3

[initial_conditions_region_1]
r      = 3.7333333333333334
u      = 1.25
v      = 0.0
w      = 0.0
p      = 4.5
emin_x = 0.0
emax_x = 0.2
emin_y = 0.0
emax_y = 1.0
emin_z = 0.0
emax_z = 1.0

[initial_conditions_region_2]
r      = 1.4
u      = 0.0
v      = 0.0
w      = 0.0
p      = 1.0
emin_x = 0.2
emax_x = 1.0
emin_y = 0.0
emax_y = 1.0
emin_z = 0.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.25
CFL      = 0.5

[diagnostics]
conservation_history_save = 1

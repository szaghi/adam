; FLUME speedup matrix, case xy-oct-shock-cylinder-noamr (make_inputs.py: edit matrix.conf and rerun, not this file)
; Mach 2 shock over a cylinder, streamwise axis x, plane xy, null axis z, octtree; uniform at level 4
[IO]
output_basename        = shock-cylinder
it_save                = 1000000
restart                = .false.
restart_basename       = shock-cylinder-restart
restart_save           = 0
residuals_save         = 1
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 32
nj     = 32
nk     = 4
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .true.

[amr]
max_level      = 4
ratio          = 8
iu_ref_levels  = 4
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 0
iters          = 1
markers_number = 0

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-33

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[linear-algebra]
smoothing         = gauss-seidel
iterations_init   = 3
iterations_coarse = 10
iterations_fine   = 3
iterations        = 10
tolerance         = 1.e-20

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 1
n_eikonal = 2

[solid_1]
name            = cylinder
bc_type         = 2                 ; Euler wall
definition      = analytical_circle
circle_center_x = 0.5
circle_center_y = 0.5
circle_center_z = 0.5
circle_radius   = 0.13
circle_axis     = z

[slices]
slices_number = 0

[physics]
physical_model = euler
cp             = 1040.004
cv             = 742.86

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.

[bc_x_min]
type = inflow
r = 3.7333333333333334
u = 1.25
v = 0.0
w = 0.0
p = 4.5
[bc_x_max]
type = extrapolation
[bc_y_min]
type = wall-inviscid
[bc_y_max]
type = wall-inviscid
[bc_z_min]
type = extrapolation
[bc_z_max]
type = extrapolation

[initial_conditions]
type           = riemann-problem
regions_number = 2
amr_iterations = 0

[initial_conditions_region_1]
r      = 3.7333333333333334
u      = 1.25
v      = 0.0
w      = 0.0
p      = 4.5
emin_x = 0.0
emax_x = 0.2
emin_y = 0.0
emax_y = 1.0
emin_z = 0.0
emax_z = 1.0

[initial_conditions_region_2]
r      = 1.4
u      = 0.0
v      = 0.0
w      = 0.0
p      = 1.0
emin_x = 0.2
emax_x = 1.0
emin_y = 0.0
emax_y = 1.0
emin_z = 0.0
emax_z = 1.0

[time]
it_max   = -1
time_max = 0.25
CFL      = 0.5

[diagnostics]
conservation_history_save = 1

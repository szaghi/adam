; FLUME profiling case: 3-D Couette channel, size small (make_profile.py: rerun it, do not edit)
; NI 16, base level 2, the wall block layers refined to level 3; 20 steps, a regrid every 10
[IO]
output_basename        = couette3d
it_save                = 0
restart                = .false.
restart_basename       = couette3d-restart
restart_save           = 0
residuals_save         = 0
save_memory_status     = .false.
save_residual_fields   = .false.
save_auxiliary_fields  = .false.
save_curl_fields       = .false.
save_divergence_fields = .false.
save_gradient_fields   = .false.
save_laplacian_fields  = .false.

[grid]
ni     = 16
nj     = 16
nk     = 16
ngc    = 3
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[amr]
max_level      = 3
ratio          = 8
iu_ref_levels  = 2
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 10
iters          = 1
markers_number = 2

[amr_marker_1]
mode         = 1           ; geometric
geo_type     = primitive-box
delta_type   = max
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = -1.0e30
box_ymin     = -1e+30
box_zmin     = -1.0e30
box_xmax     = 1.0e30
box_ymax     = 0.25
box_zmax     = 1.0e30
target_level = 3

[amr_marker_2]
mode         = 1           ; geometric
geo_type     = primitive-box
delta_type   = max
delta_fine   = 0.0
delta_coarse = 0.0
box_xmin     = -1.0e30
box_ymin     = 0.75
box_zmin     = -1.0e30
box_xmax     = 1.0e30
box_ymax     = 1e+30
box_zmax     = 1.0e30
target_level = 3

[field]
nv = 5

[runge_kutta]
scheme = runge-kutta-ssp-54

[weno]
scheme              = weno-u-5
ror_number          = 0
ror_threshold       = 0.9
ror_vars_number     = 0
enable_ror_stats    = .false.
ib_reduction_extent = 0
ib_reduced_order    = 2

[fdv]
fdv_scheme = fd
fdv_order  = 2

[solids]
number    = 0
n_eikonal = 0

[slices]
slices_number = 0

[physics]
physical_model = euler
gamma          = 1.4
viscosity      = 0.01
prandtl        = 0.75

[numerics]
scheme_space             = weno
reconstruction_variables = characteristic
reflux                   = .true.
dissipative_order        = 4

[time]
it_max   = 20
time_max = 1.0e30
CFL      = 0.2

[diagnostics]
conservation_history_save = 0

[bc_x_min]
type = periodic
[bc_x_max]
type = periodic
[bc_y_min]
type             = wall-isothermal
wall_temperature = 1.0
[bc_y_max]
type   = wall-noslip
wall_u = 1.0
[bc_z_min]
type = periodic
[bc_z_max]
type = periodic

[initial_conditions]
type             = couette
amr_iterations   = 1
wall_y0          = 0.0
height           = 1.0
wall_velocity    = 1.0
wall_temperature = 1.0

[initial_conditions_region_1]
r = 1.0
u = 0.0
v = 0.0
w = 0.0
p = 1.0

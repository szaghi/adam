; FLUME speedup matrix, the grid-size study of the uniform sphere (2026-11-24, issue #133; README "Grid size on the GPU
; node"). An overlay of matrix.conf, not a conf of its own: run.sh reads one file, so concatenate the two,
;   cat matrix.conf grid-study-cases.conf > <work>/grid-study.conf
; and pass --conf <work>/grid-study.conf. Every case is a weak case of leg 2 (role U, a 20-step cold start, no settle).
; ---- grid-dimension study (2026-11-24, owner: do the grid dimensions affect the uniform results?) ----
; A: load on one A30 at fixed level and block count (512 blocks at L3), the block edge varies: h = 1/(8 b)
[weak.wg-b16]
leg           = 2
max_level     = 3
block         = 16           ; 128^3 = 2.10 M
[weak.wg-b20]
leg           = 2
max_level     = 3
block         = 20           ; 160^3 = 4.10 M
[weak.wg-b24]
leg           = 2
max_level     = 3
block         = 24           ; 192^3 = 7.08 M (= w2-sphere-l3)
[weak.wg-b28]
leg           = 2
max_level     = 3
block         = 28           ; 224^3 = 11.2 M
[weak.wg-b32]
leg           = 2
max_level     = 3
block         = 32           ; 256^3 = 16.8 M
; B: the same 192^3 grid (h = 1/192) cut into 64, 512 (wg-b24) and 4096 blocks
[weak.wg-l2b48]
leg           = 2
max_level     = 2
block         = 48
[weak.wg-l4b12]
leg           = 2
max_level     = 4
block         = 12
; A, the high end: the memory ceiling of one A30 (estimate ~28 M cells: 49.1 doubles per stored-cell slot + 1.95 GiB)
[weak.wg-b36]
leg           = 2
max_level     = 3
block         = 36           ; 288^3 = 23.9 M
[weak.wg-b38]
leg           = 2
max_level     = 3
block         = 38           ; 304^3 = 28.1 M
[weak.wg-b40]
leg           = 2
max_level     = 3
block         = 40           ; 320^3 = 32.8 M: expected over the 0.85 budget (the ceiling's verification)
; the inter-node weak pair at 38^3 blocks: wg-b38 on 4 A30 (one node) against L4 on 32 A30 (8 nodes), 7.02 M cells per A30
[weak.wg-l4b38]
leg           = 2
max_level     = 4
block         = 38           ; 608^3 = 225 M

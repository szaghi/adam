[IO]
output_basename    = poisson
it_save            = 1
restart            = .false.
restart_basename   = poisson-restart
restart_save       = 10000
save_memory_status = .false.
residuals_save     = 1

[time]
time_max  = 0.2
it_max    = 5000
CFL       = 0.5
smoothing = sor-omp ; multigrid ; gauss-seidel ; sor ; sor-omp

[grid]
ni     = 32
nj     = 32
nk     = 32
ngc    = 1
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0
null_x = .false.
null_y = .false.
null_z = .false.

[initial_conditions]
amr_iterations = 0 ; number of AMR update/set IC iterations
type           = gauss
regions_number = 1
[initial_conditions_region_1]
r      = 1.0
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0

[bc_x_min]
type = dirichlet
phi = 0.0
[bc_x_max]
type = dirichlet
phi = 0.0
[bc_y_min]
type = dirichlet
phi = 0.0
[bc_y_max]
type = dirichlet
phi = 0.0
[bc_z_min]
type = dirichlet
phi = 0.0
[bc_z_max]
type = dirichlet
phi = 0.0

 [amr]
ratio          = 8
max_level      = 0
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 50000
iters          = 1
markers_number = 0
[amr_marker_1]
mode         = 2 ; grad
delta_fine   = 0.25
delta_coarse = 1.0
field        = 2 ; 1=q, 2=q_aux
var          = 1
tol          = 0.5

[solids]
number    = 0
n_eikonal = 2
[solid_1]
name            = sphere
bc_type         = 1 ; BCS_VISCOUS
definition      = analytical_sphere
sphere_center_x = 10.0
sphere_center_y = 10.0
sphere_center_z = 10.0
sphere_radius   = 1.0

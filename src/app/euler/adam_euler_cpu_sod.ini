[simulation]
restart            = .false.
restart_basename   = sod-restart
restart_save       = 1000
time_max           = 0.2
it_max             = -1
it_save            = 1
time_save          = 0.01
CFL                = 0.5
output_basename    = sod
save_memory_status = .false.
null_x             = .false.
null_y             = .true.
null_z             = .true.

[schemes]
weno = weno-3
runge_kutta = rk-ls-qn-33
fluxes_convective = finite-difference
riemann_solver = fvs-glf

; WENO schemes
;   weno-1
;   weno-3
;   weno-5
;   weno-7
; RK schemes
;   rk-ls-qn-11
;   rk-ls-qn-22
;   rk-ls-qn-33
;   rk-ls-qs-54
;   rk-ls-qs-64
;   rk-ls-qs-74
;   rk-ns-qs-54
; fluxes convective schemes
;   finite-difference
;   finite-volume
; Riemann solvers
;   fvs-llf
;   fvs-sw
;   fvs-van-leer
;   fvs-glf
;   llf

[grid]
ni     = 100
nj     = 1
nk     = 1
ngc    = 4
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[physics]
ns = 1

[physics_specie_1]
cp = 1005.2
cv = 718.
; cp = 1040.
; cv = 742.85

[initial_conditions]
regions_number = 2

[initial_conditions_region_1]
r      = 1.0
u      = 0.0
v      = 0.0
w      = 0.0
p      = 1.0
s      = 1
emin_x = 0.0
emin_y = 0.0
emin_z = 0.0
emax_x = 0.5
emax_y = 1.0
emax_z = 1.0

[initial_conditions_region_2]
r      = 0.125
u      = 0.
v      = 0.
w      = 0.
p      = 0.1
s      = 1
emin_x = 0.5
emin_y = 0.0
emin_z = 0.0
emax_x = 1.0
emax_y = 1.0
emax_z = 1.0

[bc_x_min]
type = 1 ; BC_EXTRAPOLATION

[bc_x_max]
type = 1 ; BC_EXTRAPOLATION

[bc_y_min]
type = 1 ; BC_EXTRAPOLATION

[bc_y_max]
type = 1 ; BC_EXTRAPOLATION

[bc_z_min]
type = 1 ; BC_EXTRAPOLATION

[bc_z_max]
type = 1 ; BC_EXTRAPOLATION

[slices]
slices_number = 0

[slice_1]
itype  = trilinear
n_save = 20
ni     = 80
nj     = 1
nk     = 1
emin_x = 0.1
emin_y = 10.0001
emin_z = 10.0001
emax_x = 19.9
emax_y = 10.0001
emax_z = 10.0001

[amr]
max_level      = 8
iu_ref_levels  = 0
i_prune        = 0
j_prune        = 0
k_prune        = 0
l_prune        = -1
frequency      = 1000
iters          = 1
markers_number = 0

[amr_marker_1]
mode         = 2 ; grad
delta_fine   = 0.25
delta_coarse = 1.0
field        = 2 ; 1=q, 2=q_aux
var          = 1
tol          = 0.5

[amr_marker_2]
mode          = 1 ; geom
delta_fine    = 0.001
delta_coarse  = 0.02
solid         = 1

[solids]
solids_number = 0

[solid_1]
name    = sphere.off
bc_type = 1 ; BCS_VISCOUS

<svg fill="none" width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          column-gap: 20px;
          row-gap: 10px; /* Ridotto il gap tra le righe */
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          padding: 0; /* Rimosso padding esterno */
          margin: 0;
        }
        .feature {
          vertical-align: top;
        }
        .title {
          font-weight: 600;
          font-size: 20px;
          margin-bottom: 4px;
          display: block;
          color: #24292f;
        }
        .description {
          font-size: 16px;
          line-height: 1.4;
          color: #57606a;
        }
        @media (prefers-color-scheme: dark) {
          .title { color: #c9d1d9; }
          .description { color: #8b949e; }
        }
      </style>
      <div class="container">
        <div class="feature">
          <span class="title">🌲 Adaptive Mesh Refinement</span>
          <div class="description">Morton-order linearized octree/quadtree for efficient AMR with automatic refinement.</div>
        </div>
        <div class="feature">
          <span class="title">🕸️ Immersed Boundary</span>
          <div class="description">Handle complex geometries without body-fitted meshes using accurate IB techniques.</div>
        </div>
        <div class="feature">
          <span class="title">⚡ Multi-backend GPU</span>
          <div class="description">CUDA Fortran (NVF), OpenACC (FNL), and OpenMP (GMP) for exascale HPC.</div>
        </div>
        <div class="feature" style="margin-top: 15px;">
          <span class="title">⚖️ Dual-licensed</span>
          <div class="description">Released under MIT or LGPLv3 — choose the license that best fits your project.</div>
        </div>
        <div class="feature" style="margin-top: 15px;">
          <span class="title">⚛️ Physics-Agnostic</span>
          <div class="description">Core SDK is modular and reusable. New solvers are built on top of ADAM.</div>
        </div>
        <div class="feature" style="margin-top: 15px;">
          <span class="title">🔧 INI Configuration</span>
          <div class="description">Simulations fully configured through INI files — no recompilation needed.</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
